# Déploiement de la Production (V2-F01) — procédure : docs/ops/deploiement-production.md
#
# Jamais automatique : lancé à la main (Actions → Deploy Production → Run workflow) depuis main, puis APPROUVÉ par un
# relecteur de l'environnement GitHub « production » avant de toucher au serveur (validation manuelle).
# - Sans tag : CI complète sur le commit de main, images construites et publiées (tag prod-sha-<commit>), déploiement.
# - Avec un tag déjà publié (ex. prod-sha-1a2b3c4d5e6f) : redéploiement de cette version (retour arrière), sans
#   reconstruire.
#
# Images distinctes du Staging (tag prod-sha-…) : elles sont construites sans les options réservées au Staging
# (jeux virtuels), et un tag du Staging ne peut pas être déployé ici.
#
# Inactif tant que la variable de dépôt PRODUCTION_ENABLED ne vaut pas « true » (serveur non configuré).
# Secrets de l'environnement GitHub « production », distincts de ceux du Staging : PRODUCTION_SSH_HOST,
# PRODUCTION_SSH_USER, PRODUCTION_SSH_KEY, PRODUCTION_SSH_KNOWN_HOSTS. Variables : PRODUCTION_URL,
# PRODUCTION_DEPLOY_DIR (défaut /opt/reyel16-production).
# Les secrets de l'application (.env) restent sur le serveur : ils ne passent jamais par GitHub.

name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag déjà publié à redéployer (ex. prod-sha-1a2b3c4d5e6f) ; vide = construire et déployer main"
        required: false
        default: ""

# Un seul déploiement à la fois, jamais interrompu en cours de route.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Préparer
    runs-on: ubuntu-latest
    if: vars.PRODUCTION_ENABLED == 'true'
    outputs:
      tag: ${{ steps.target.outputs.tag }}
      build: ${{ steps.target.outputs.build }}
      image: ${{ steps.target.outputs.image }}
    steps:
      - name: Version à déployer
        id: target
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::La Production se déploie depuis main uniquement."; exit 1; }
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          if [ -n "$INPUT_TAG" ]; then
            [[ "$INPUT_TAG" =~ ^prod-sha-[0-9a-f]{12}$ ]] || { echo "::error::Tag invalide : $INPUT_TAG (attendu : prod-sha-<12 caractères>)"; exit 1; }
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag=prod-sha-${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
          echo "build=true" >> "$GITHUB_OUTPUT"

  # Tests préalables : la CI complète (backend, contrat API, frontend) sur le commit exact qui sera déployé.
  tests:
    name: Tests
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    uses: ./.github/workflows/ci.yml

  build:
    name: Images (${{ matrix.target }})
    needs: [prepare, tests]
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [backend, web]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/production/Dockerfile
          target: ${{ matrix.target }}
          # Aucune option du Staging : jeux virtuels absents tant que D-11 n'est pas validée.
          build-args: |
            VITE_VIRTUAL_GAMES=false
          load: true
          tags: ${{ needs.prepare.outputs.image }}-${{ matrix.target }}:${{ needs.prepare.outputs.tag }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=prod-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=prod-${{ matrix.target }}

      - name: Vérifier l'image backend
        if: matrix.target == 'backend'
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}-backend:${{ needs.prepare.outputs.tag }}
        run: |
          docker run --rm --entrypoint php "$IMAGE" -m | grep -qx pdo_pgsql
          docker run --rm --entrypoint php "$IMAGE" artisan --version
          docker run --rm --entrypoint php-fpm "$IMAGE" -t

      - name: Vérifier l'image web
        if: matrix.target == 'web'
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}-web:${{ needs.prepare.outputs.tag }}
        run: |
          docker run --rm -e SITE_ADDRESS=localhost -e ACME_EMAIL=ci@example.com "$IMAGE" caddy validate --config /etc/caddy/Caddyfile
          docker run --rm "$IMAGE" test -f /srv/frontend/index.html

      - name: Publier
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}-${{ matrix.target }}:${{ needs.prepare.outputs.tag }}
        run: docker push "$IMAGE"

  deploy:
    name: Déployer
    needs: [prepare, build]
    # Redéploiement d'un tag : pas de build. Sinon, seulement si tests et images ont réussi.
    if: >-
      always() && needs.prepare.result == 'success' && (
        (needs.prepare.outputs.build == 'true' && needs.build.result == 'success') ||
        needs.prepare.outputs.build == 'false'
      )
    runs-on: ubuntu-latest
    # Validation manuelle : l'environnement « production » exige l'approbation d'un relecteur (Settings → Environments).
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    permissions:
      contents: read
      packages: read
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      DEPLOY_DIR: ${{ vars.PRODUCTION_DEPLOY_DIR || '/opt/reyel16-production' }}
      SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
      SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Vérifier la configuration
        env:
          SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          missing=""
          for name in SSH_HOST SSH_USER SSH_KEY KNOWN_HOSTS PRODUCTION_URL; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          [ -z "$missing" ] || { echo "::error::Configuration production incomplète :$missing (docs/ops/deploiement-production.md)"; exit 1; }

      - name: Clé SSH (empreinte du serveur vérifiée)
        env:
          SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/production_key
          chmod 600 ~/.ssh/production_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host production\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/production_key\n  StrictHostKeyChecking yes\n  BatchMode yes\n' \
            "$SSH_HOST" "$SSH_USER" > ~/.ssh/config

      # Dans les commandes ssh, $DEPLOY_DIR et $TAG sont développés ici, côté runner (SC2029 voulu).
      - name: Copier les fichiers de déploiement
        run: |
          # shellcheck disable=SC2029
          ssh production "mkdir -p '$DEPLOY_DIR/scripts/db' '$DEPLOY_DIR/backups'"
          scp docker/production/docker-compose.yml docker/production/docker-compose.local-db.yml \
            scripts/deploy/production-deploy.sh "production:$DEPLOY_DIR/"
          scp scripts/db/backup.sh scripts/db/restore.sh scripts/db/verify.sh scripts/db/lib.sh \
            scripts/db/restrict-app-role.sql scripts/db/production-roles.sql scripts/db/local-app-role.sh \
            "production:$DEPLOY_DIR/scripts/db/"
          # shellcheck disable=SC2029
          ssh production "chmod +x '$DEPLOY_DIR/production-deploy.sh' '$DEPLOY_DIR'/scripts/db/*.sh"

      - name: Contrôler la configuration du serveur
        run: |
          # shellcheck disable=SC2029
          ssh production "'$DEPLOY_DIR/production-deploy.sh' check"

      - name: Déployer ${{ needs.prepare.outputs.tag }}
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          # Jeton de lecture de GHCR valable le temps de ce job seulement, retiré du serveur ensuite.
          # shellcheck disable=SC2029
          printf '%s' "$REGISTRY_TOKEN" | ssh production "docker login ghcr.io -u '$REGISTRY_USER' --password-stdin"
          status=0
          # shellcheck disable=SC2029
          ssh production "'$DEPLOY_DIR/production-deploy.sh' deploy '$TAG'" || status=$?
          ssh production "docker logout ghcr.io" || true
          exit "$status"

      - name: Contrôle HTTPS depuis Internet
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          curl -fsS --retry 10 --retry-delay 6 --retry-all-errors "$PRODUCTION_URL/api/v1/health" | grep -q '"status":"ok"'
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "$PRODUCTION_URL/" | grep -q '<div id="root">'
          echo "Production $TAG en service : $PRODUCTION_URL"

      - name: Nettoyer la clé SSH
        if: always()
        run: rm -f ~/.ssh/production_key
