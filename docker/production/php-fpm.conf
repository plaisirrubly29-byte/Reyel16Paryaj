; Pool php-fpm de Staging / Production (P1-06), après les réglages de l'image officielle (écoute sur 9000).
[www]
; Les variables d'environnement du conteneur (DB_HOST, REDIS_HOST…) restent visibles de PHP.
clear_env = no
; Contrôle de santé du conteneur (cgi-fcgi), sans passer par Laravel.
ping.path = /ping
ping.response = pong

pm = dynamic
; Processus PHP au plus (PHP_FPM_MAX_CHILDREN, défaut 10 dans le Dockerfile) : à ajuster aux vCPU du serveur
; (test de charge P8-03 : environ 2 par vCPU, les processus attendant souvent Redis ou PostgreSQL).
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500
