# Production SANS base managée (option « tout sur le serveur » de D-10 §7.2) : PostgreSQL dans un conteneur.
# Activé par la ligne COMPOSE_FILE=docker-compose.yml:docker-compose.local-db.yml du .env du serveur, avec
# DB_SSLMODE=disable (le conteneur n'a pas de SSL ; il n'est joignable que par le réseau Docker).
#
# Attention : la restauration à un instant donné (PITR) n'existe pas ici. Seules les sauvegardes du script de
# déploiement (avant chaque migration) et celles planifiées sur le serveur protègent les données
# (docs/ops/deploiement-production.md §5). À n'utiliser qu'en fonds fictifs.

x-local-db: &local-db
  environment:
    DB_HOST: postgres
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:?DB_DATABASE manquant}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME manquant}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant}
    # Aucun port publié : la base n'est joignable que par les conteneurs.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      retries: 10
    restart: unless-stopped

  backend: *local-db
  queue: *local-db
  scheduler: *local-db

volumes:
  pgdata:
