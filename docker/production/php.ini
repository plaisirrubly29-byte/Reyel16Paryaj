; Réglages PHP de Staging / Production (P1-06), ajoutés à php.ini-production.
expose_php = Off
memory_limit = 256M
max_execution_time = 60

; Le code ne change pas dans un conteneur : OPcache ne revérifie pas les fichiers.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
