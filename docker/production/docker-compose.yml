# Production — REYEL 16 PARYAJ (V2-F01, décision D-10 : serveur applicatif + PostgreSQL managé, HTTPS par Caddy).
#
# Sur le serveur, ce fichier est copié dans le dossier de déploiement (ex. /opt/reyel16-production) à côté du .env
# (modèle : docker/production/production.env.example ; jamais dans Git) par .github/workflows/deploy-production.yml.
# Le déploiement passe par scripts/deploy/production-deploy.sh : voir docs/ops/deploiement-production.md.
#
# Base de données : PostgreSQL MANAGÉ (DB_HOST, DB_SSLMODE=require dans le .env), aucun conteneur ici.
# Sans base managée (option « tout sur le serveur » de D-10 §7.2), ajouter docker-compose.local-db.yml par la ligne
#   COMPOSE_FILE=docker-compose.yml:docker-compose.local-db.yml
# du .env.
#
# IMAGE_TAG (ex. sha-1a2b3c4d5e6f) est fourni par le script de déploiement : une image immuable par commit.

name: reyel16-production

x-backend: &backend
  image: ${REGISTRY_IMAGE:?REGISTRY_IMAGE manquant}-backend:${IMAGE_TAG:?IMAGE_TAG manquant}
  env_file: .env
  environment:
    REDIS_HOST: redis
  restart: unless-stopped
  depends_on:
    redis:
      condition: service_healthy

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD manquant}", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped

  backend:
    <<: *backend
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  queue:
    <<: *backend
    command: ["php", "artisan", "queue:work", "--tries=3", "--max-time=3600"]

  scheduler:
    <<: *backend
    command: ["php", "artisan", "schedule:work"]

  web:
    image: ${REGISTRY_IMAGE}-web:${IMAGE_TAG}
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS manquant}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL manquant}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data # certificats Let's Encrypt : à conserver (limites de délivrance)
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redisdata:
  caddy_data:
  caddy_config:
