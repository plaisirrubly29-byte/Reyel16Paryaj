# Staging — REYEL 16 PARYAJ (P1-06, décision D-10 : VPS + Docker Compose, HTTPS par Caddy).
# Données et fonds FICTIFS uniquement.
#
# Sur le serveur, ce fichier est copié dans le dossier de déploiement (ex. /opt/reyel16-staging) à côté du .env
# (modèle : docker/staging/staging.env.example ; jamais dans Git) par .github/workflows/deploy-staging.yml.
# Le déploiement passe par scripts/deploy/staging-deploy.sh : voir docs/ops/deploiement-staging.md.
#
# IMAGE_TAG (ex. sha-1a2b3c4d5e6f) est fourni par le script de déploiement : une image immuable par commit.

name: reyel16-staging

x-backend: &backend
  image: ${REGISTRY_IMAGE:?REGISTRY_IMAGE manquant}-backend:${IMAGE_TAG:?IMAGE_TAG manquant}
  env_file: .env
  environment:
    DB_HOST: postgres
    REDIS_HOST: redis
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:?DB_DATABASE manquant}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME manquant}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant}
    # Aucun port publié : la base n'est joignable que par les conteneurs.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD manquant}", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped

  backend:
    <<: *backend
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  queue:
    <<: *backend
    command: ["php", "artisan", "queue:work", "--tries=3", "--max-time=3600"]

  scheduler:
    <<: *backend
    command: ["php", "artisan", "schedule:work"]

  web:
    image: ${REGISTRY_IMAGE}-web:${IMAGE_TAG}
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS manquant}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL manquant}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data # certificats Let's Encrypt : à conserver (limites de délivrance)
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
