# Environnement de développement local — REYEL 16 PAYAJ
# Démarrage : docker compose up -d   (voir README.md)
# Données et fonds FICTIFS uniquement.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reyel16
      POSTGRES_USER: reyel16
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reyel16 -d reyel16"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    volumes:
      - ./backend:/var/www/backend
    env_file: ./backend/.env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  queue:
    build: ./backend
    command: php artisan queue:work --tries=3
    volumes:
      - ./backend:/var/www/backend
    env_file: ./backend/.env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      - backend

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"

volumes:
  pgdata:
  frontend_node_modules:
