# Environnement de développement local — REYEL 16 PAYAJ
# Démarrage : docker compose up -d   (voir README.md)
# Données et fonds FICTIFS uniquement.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reyel16
      POSTGRES_USER: reyel16
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reyel16 -d reyel16"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Pas d'env_file : Laravel lit backend/.env lui-même (monté). Un env_file figerait
  # les valeurs au démarrage du conteneur (ex. APP_KEY vide après key:generate).
  backend:
    build: ./backend
    # Crée .env, installe les dépendances, génère la clé et migre si nécessaire.
    entrypoint: ["sh", "docker/dev-entrypoint.sh"]
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]
    volumes:
      - ./backend:/var/www/backend
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/api/v1/health') ? 0 : 1);"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 300s # premier lancement : composer install
    restart: unless-stopped

  queue:
    build: ./backend
    command: php artisan queue:work --tries=3
    volumes:
      - ./backend:/var/www/backend
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"

volumes:
  pgdata:
  frontend_node_modules:
