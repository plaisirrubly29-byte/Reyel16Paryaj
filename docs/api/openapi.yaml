        "404": { $ref: "#/components/responses/NotFound" }
        "423": { description: Compte suspendu ou fermé }

  /responsible-gaming:
    get:
      tags: [ResponsibleGaming]
      summary: Limites de mise, pause et options de jeu responsable du joueur connecté
      description: |
        Limites sur des périodes glissantes (day = 24 dernières heures, week = 7 jours, month = 30 jours), mises de la
        période et reste. Valeurs par défaut les plus protectrices en attendant l'avis juridique (D-09, J-8).
      x-task: P7-02
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/ResponsibleGaming" } } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /responsible-gaming/limits/{period}:
    put:
      tags: [ResponsibleGaming]
      summary: Fixer, relever ou supprimer une limite de mise (journalisé)
      description: |
        Une baisse (ou une première limite) s'applique tout de suite et annule une hausse en attente. Une hausse ou une
        suppression (amount_minor null) ne s'applique qu'après le délai de réflexion (7 jours par défaut), qui repart à
        chaque nouvelle demande. Même valeur : rien ne change.
      x-task: P7-02
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: period, in: path, required: true, schema: { type: string, enum: [day, week, month] } }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_minor]
              properties:
                amount_minor: { type: [integer, "null"], minimum: 1, example: 50000, description: "Unité mineure ; null : supprimer la limite" }
      responses:
        "200":
          description: Nouvel état
          content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/ResponsibleGaming" } } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "428": { description: En-tête Idempotency-Key manquant }
  /responsible-gaming/deposit-limits/{period}:
    put:
      tags: [ResponsibleGaming]
      summary: Fixer, relever ou supprimer une limite de dépôt (journalisé)
      description: |
        Même règle que les limites de mise : une baisse (ou une première limite) s'applique tout de suite et annule une
        hausse en attente ; une hausse ou une suppression (amount_minor null) attend le délai de réflexion. Chaque dépôt
        est ensuite contrôlé sur les périodes glissantes : au-delà, 422 deposit_limit_exceeded.
      x-task: V2-B06
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: period, in: path, required: true, schema: { type: string, enum: [day, week, month] } }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_minor]
              properties:
                amount_minor: { type: [integer, "null"], minimum: 1, example: 500000, description: "Unité mineure ; null : supprimer la limite" }
      responses:
        "200":
          description: Nouvel état
          content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/ResponsibleGaming" } } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "428": { description: En-tête Idempotency-Key manquant }
  /responsible-gaming/loss-limits/{period}:
    put:
      tags: [ResponsibleGaming]
      summary: Fixer, relever ou supprimer une limite de pertes (journalisé)
      description: |
        Perte nette de la période glissante = mises moins gains et remboursements (0 si le joueur est gagnant). Même
        règle que les limites de mise : baisse immédiate, hausse ou suppression après le délai de réflexion. POST /bets
        compte le nouveau pari comme perdu : au-delà, 422 loss_limit_exceeded.
      x-task: V2-E06
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: period, in: path, required: true, schema: { type: string, enum: [day, week, month] } }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_minor]
              properties:
                amount_minor: { type: [integer, "null"], minimum: 1, example: 200000, description: "Unité mineure ; null : supprimer la limite" }
      responses:
        "200":
          description: Nouvel état
          content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/ResponsibleGaming" } } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "428": { description: En-tête Idempotency-Key manquant }
  /responsible-gaming/session-reminder:
    put:
      tags: [ResponsibleGaming]
      summary: Choisir l'intervalle du rappel de durée de session (journalisé)
      description: |
        L'écran affiche un rappel toutes les `minutes` depuis `session.started_at` (heure de la connexion). Désactivé par
        défaut ; le changement s'applique tout de suite, dans les deux sens.
      x-task: V2-E06
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [minutes]
              properties:
                minutes: { type: [integer, "null"], enum: [15, 30, 60, null], description: "null : rappel désactivé" }
      responses:
        "200":
          description: Nouvel état
          content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/ResponsibleGaming" } } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "428": { description: En-tête Idempotency-Key manquant }
  /responsible-gaming/history:
    get:
      tags: [ResponsibleGaming]
      summary: Historique des dépenses du joueur connecté, par jour et par mois
      description: |
        Les 30 derniers jours puis les 12 derniers mois, du plus récent au plus ancien, périodes sans mouvement
        comprises. Découpage dans le fuseau d'affichage (America/Port-au-Prince). net = gains + remboursements - mises
        (positif si le joueur a gagné plus qu'il n'a misé).
      x-task: V2-E06
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      timezone: { type: string, example: America/Port-au-Prince }
                      days:
                        type: array
                        items:
                          allOf:
                            - { type: object, properties: { date: { type: string, format: date } } }
                            - $ref: "#/components/schemas/SpendingTotals"
                      months:
                        type: array
                        items:
                          allOf:
                            - { type: object, properties: { month: { type: string, example: "2026-11" } } }
                            - $ref: "#/components/schemas/SpendingTotals"
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /responsible-gaming/pause:
    post:
      tags: [ResponsibleGaming]
      summary: Faire une pause dans les paris (irrévocable, journalisé)
      description: |
        Pendant la pause, POST /bets renvoie 422 betting_paused ; le joueur reste connecté (solde, tickets). Une pause en
        cours n'est jamais raccourcie : une durée plus courte ne change rien, une durée plus longue la prolonge.
      x-task: P7-02
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [duration], properties: { duration: { type: string, enum: ["24h", "7d", "30d"] } } } } }
      responses:
        "200":
          description: Nouvel état
          content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/ResponsibleGaming" } } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "428": { description: En-tête Idempotency-Key manquant }
  /responsible-gaming/self-exclusion:
    post:
      tags: [ResponsibleGaming]
      summary: S'exclure du jeu (irrévocable, mot de passe requis, journalisé et audité)
      description: |
        Le compte passe en « excluded » et la session est fermée : toute connexion renvoie 423 account_excluded.
        À l'échéance, le compte reste exclu jusqu'à une demande de réouverture traitée par la Conformité.
      x-task: P7-02
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [duration, password]
              properties:
                duration: { type: string, enum: ["6m", "1y", "5y"] }
                password: { type: string, description: Mot de passe du compte (confirmation) }
      responses:
        "200":
          description: Compte exclu, session fermée
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      excluded_until: { type: string, format: date-time }
                      reopening: { type: string, enum: [on_request] }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { description: "`invalid_password` ou `validation_failed`", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "428": { description: En-tête Idempotency-Key manquant }
        "429": { $ref: "#/components/responses/TooManyRequests" }

