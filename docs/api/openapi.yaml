  /complaints:
    get:
      tags: [Complaints]
      summary: Réclamations du joueur connecté (plus récentes d'abord)
      x-task: V2-G04
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [new, in_progress, investigation, resolved, closed] } }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
