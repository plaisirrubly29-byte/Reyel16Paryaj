                items:
                  type: object
                  properties:
                    id: { type: string }
                    key: { type: string, example: home_draw, description: "home, draw, away ; home_draw, home_away, draw_away ; over, under ; yes, no ; odd, even ; score exact \"2-1\" ; à plusieurs lignes : \"over_2.5\", \"home_-1.5\", \"away_under_0.5\"" }
                    label: { type: string, example: "1X", description: "1, X, 2 ; 1X, 12, X2 ; > 2.5 / < 2.5 ; Oui / Non ; 1 (-0.5) / 2 (+0.5) ; 1 > 1.5 ; Impair / Pair ; 2-1" }
                    name: { type: string, example: Arsenal }
                    odds: { type: string, example: "2.10", description: Cote décimale en chaîne (jamais de float) }
    BetTicket:
      type: object
      description: Reçu immuable — mise, cotes et gain potentiel figés à l'acceptation ; seuls le statut et le gain versé évoluent au règlement.
      properties:
        id: { type: string }
        reference: { type: string, example: R16-7KQ2M9XAPB, description: Référence à communiquer au support }
