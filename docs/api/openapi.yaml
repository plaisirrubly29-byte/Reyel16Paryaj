        "200":
          description: Correction validée (status approved, reversal_entry_id renseigné)
          content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/FinanceCorrection" } } } } }
        "403":
          description: "Permission refusée, `self_approval_forbidden` ou `approver_role_too_recent`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`correction_not_pending` : déjà validée ou refusée"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422": { description: "Validation, ou `entry_not_correctable`" }
        "423": { description: "`wallet_frozen` : portefeuille gelé" }
  /admin/finance/corrections/{id}/reject:
    post:
      tags: [Admin]
      summary: Refuser une correction — aucune écriture (permission finance.approve, motif requis)
      description: Le demandeur peut retirer sa propre demande par ce refus ; il ne peut jamais la valider.
      x-task: P6-04
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 5, maxLength: 500 } } } } }
      responses:
        "200":
          description: Correction refusée (status rejected)
          content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/FinanceCorrection" } } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`correction_not_pending`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/lottery/tickets:
    get:
      tags: [Admin]
      summary: Fiches de borlette (permission tickets.view)
      description: V2-D09. Tous les rôles administratifs. Joueur réduit à son identifiant et son nom. Plus récentes d'abord.
      x-task: V2-D09
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: reference, in: query, description: "Référence exacte ; casse et espaces ignorés", schema: { type: string } }
        - { name: draw, in: query, schema: { type: string } }
        - { name: date, in: query, description: Date locale du tirage, schema: { type: string, format: date } }
        - { name: status, in: query, schema: { type: string, enum: [pending, won, lost, void] } }
        - { name: user_id, in: query, schema: { type: string } }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/AdminLotteryTicket" } }
                  links: { $ref: "#/components/schemas/PaginationLinks" }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/lottery/exposure:
    get:
      tags: [Admin]
      summary: Engagement par boule pour un tirage et une date (permission tickets.view)
      description: |
        V2-D09. Pour chaque combinaison jouée (jeu, option, numéros) des fiches en cours : mises cumulées et gain
        maximal si elle sort (pire cas, au multiplicateur le plus élevé du jeu), comparé au plafond. Trié par gain
        maximal décroissant ; 200 lignes au plus. Boules bloquées signalées.
      x-task: V2-D09
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: draw, in: query, required: true, schema: { type: string } }
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
        - { name: game, in: query, schema: { type: string, enum: [bolet, maryaj, loto3, loto4, loto5] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      draw: { type: object, properties: { key: { type: string }, name: { type: string } } }
                      date: { type: string, format: date }
                      closes_at: { type: string, format: date-time }
                      tickets_count: { type: integer }
                      total_stake: { $ref: "#/components/schemas/Money" }
                      numbers:
                        type: array
                        items:
                          type: object
                          properties:
                            game: { type: string, enum: [bolet, maryaj, loto3, loto4, loto5] }
                            option: { type: [integer, "null"] }
                            numbers: { type: array, items: { type: string } }
                            stake: { $ref: "#/components/schemas/Money" }
                            max_payout: { $ref: "#/components/schemas/Money" }
                            limit: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }], description: Plafond de gain de cette boule ; null = aucun }
                            blocked: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /admin/lottery/blocked-numbers:
    get:
      tags: [Admin]
      summary: Boules bloquées en vigueur (permission tickets.view)
      x-task: V2-D09
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: draw, in: query, schema: { type: string } }
        - { name: date, in: query, description: "Blocages valables ce jour-là (y compris ceux de tous les jours)", schema: { type: string, format: date } }
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/LotteryBlockedNumber" } } } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Admin]
      summary: Bloquer une boule (permission markets.suspend, motif requis, audité)
      description: |
        V2-D09. Bloque la vente d'une boule de 2 chiffres (toutes les lignes qui la contiennent : bolet, maryaj, et
        les lots de loto 4 / loto 5) ou d'un numéro de loto précis. draw null = tous les tirages ; date null = tous
        les jours. Les fiches déjà vendues ne changent pas. Audit lottery.number_blocked.
      x-task: V2-D09
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [number, reason]
              properties:
                number: { type: string, pattern: "^[0-9]{2,5}$" }
                draw: { type: [string, "null"] }
                date: { type: [string, "null"], format: date }
                reason: { type: string, minLength: 5, maxLength: 500 }
      responses:
        "201":
          description: Boule bloquée
          content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/LotteryBlockedNumber" } } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: lottery_number_already_blocked (même numéro, tirage et date)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: validation_failed ; lottery_draw_unknown
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "428": { description: En-tête Idempotency-Key manquant }
  /admin/lottery/blocked-numbers/{id}:
    delete:
      tags: [Admin]
      summary: Débloquer une boule (permission markets.suspend, motif requis, audité)
      description: V2-D09. Le blocage est clos (conservé dans l'historique), jamais effacé. Audit lottery.number_unblocked.
      x-task: V2-D09
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 5, maxLength: 500 } } } } }
      responses:
        "200":
          description: Blocage clos
          content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/LotteryBlockedNumber" } } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: lottery_block_already_lifted
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/complaints:
    get:
      tags: [Admin]
      summary: File des réclamations (permission complaints.view)
      description: |
        V2-G04. Sans filtre status : réclamations ouvertes (new, in_progress, investigation), plus anciennes d'abord.
        Avec status resolved ou closed : plus récentes d'abord. older_than_hours : ouvertes depuis au moins N heures
        (dernière activité du joueur sans réponse de l'équipe, voir awaiting_staff).
      x-task: V2-G04
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [new, in_progress, investigation, resolved, closed] } }
        - { name: category, in: query, schema: { type: string, enum: [bet, transaction, account, other] } }
        - { name: user_id, in: query, schema: { type: string } }
        - { name: assigned_to, in: query, schema: { type: string }, description: "Identifiant d'un administrateur, ou me, ou none" }
        - { name: older_than_hours, in: query, schema: { type: integer, minimum: 1 } }
        - { name: q, in: query, schema: { type: string, maxLength: 40 }, description: Numéro de réclamation (REC-…) ou référence de ticket }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/AdminComplaint" } }
                  links: { $ref: "#/components/schemas/PaginationLinks" }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/complaints/{id}:
    get:
      tags: [Admin]
      summary: Fiche d'une réclamation — messages, notes internes et historique complet (permission complaints.view)
      x-task: V2-G04
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/AdminComplaintDetail" } } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/complaints/{id}/messages:
    post:
      tags: [Admin]
      summary: Répondre au joueur ou ajouter une note interne (permission complaints.manage)
      description: |
        V2-G04. multipart/form-data, mêmes règles de pièces que le joueur. visibility player : réponse visible du joueur,
        qui est notifié (V2-E04 quand il sera fait) ; une première réponse fait passer une réclamation new en
        in_progress. visibility internal : note jamais montrée au joueur. Refusé sur closed (409 complaint_closed).
        Audit complaint.replied ou complaint.note_added.
      x-task: V2-G04
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [body, visibility]
              properties:
                body: { type: string, minLength: 1, maxLength: 5000 }
                visibility: { type: string, enum: [player, internal] }
                attachments[]:
                  type: array
                  maxItems: 5
                  items: { type: string, format: binary }
      responses:
        "201":
          description: Message ajouté ; renvoie la fiche à jour
          content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/AdminComplaintDetail" } } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: complaint_closed
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422": { $ref: "#/components/responses/ValidationError" }
  /admin/complaints/{id}/status:
    post:
      tags: [Admin]
      summary: Changer le statut (permission complaints.manage, motif requis, audité)
      description: |
        V2-G04. Transitions autorisées :
        new → in_progress, investigation, resolved ; in_progress → investigation, resolved ;
        investigation → in_progress, resolved ; resolved → closed ; resolved ou closed → in_progress (réouverture).
        Toute autre transition : 409 complaint_invalid_transition (details.from, details.to, details.allowed).
        Le motif d'un passage en resolved est montré au joueur (resolution) ; les autres restent internes.
        Une réclamation resolved passe seule en closed après complaints.auto_close_days (7 jours par défaut) sans
        réouverture. Audit complaint.status_changed.
      x-task: V2-G04
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, reason]
              properties:
                status: { type: string, enum: [in_progress, investigation, resolved, closed] }
                reason: { type: string, minLength: 5, maxLength: 1000 }
      responses:
        "200":
          description: Statut changé ; renvoie la fiche à jour
          content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/AdminComplaintDetail" } } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: complaint_invalid_transition
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422": { $ref: "#/components/responses/ValidationError" }
        "428": { description: En-tête Idempotency-Key manquant }
  /admin/complaints/{id}/assignee:
    put:
      tags: [Admin]
      summary: Attribuer la réclamation à un administrateur, ou la libérer (permission complaints.manage)
      description: |
        V2-G04. assignee_id null : réclamation libérée. L'administrateur choisi doit avoir complaints.manage
        (422 complaint_assignee_invalid). Audit complaint.assigned.
      x-task: V2-G04
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [assignee_id], properties: { assignee_id: { type: [string, "null"] } } } } }
      responses:
        "200":
          description: Attribution enregistrée
          content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/AdminComplaintDetail" } } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: validation_failed ; complaint_assignee_invalid
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /admin/complaints/{id}/attachments/{attachment}:
    get:
      tags: [Admin]
      summary: Pièce jointe déchiffrée (permission complaints.view, ouverture auditée)
      description: V2-G04. Contenu brut (Content-Type du fichier), Cache-Control no-store. Audit complaint.attachment_viewed.
      x-task: V2-G04
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: attachment, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Fichier
          content:
            image/*: { schema: { type: string, format: binary } }
            application/pdf: { schema: { type: string, format: binary } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID unique par intention utilisateur. Une requête rejouée renvoie la même réponse.
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      description: Taille de page, bornée à 100.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    ValidationError:
      description: Données invalides
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              code: validation_failed
              message: Les données envoyées sont invalides.
              details: { phone: ["Le champ phone est obligatoire."] }
    Unauthenticated:
      description: Authentification requise
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: unauthenticated, message: Authentification requise. } }
    Forbidden:
      description: Permission refusée
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: forbidden, message: Action non autorisée. } }
    NotFound:
      description: Introuvable (ou non autorisé, sans révéler l'existence)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: not_found, message: Ressource introuvable. } }
    TooManyRequests:
      description: Trop de tentatives
      headers:
        Retry-After: { schema: { type: integer }, description: Secondes avant de réessayer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: too_many_requests, message: Trop de tentatives. Réessayez plus tard. } }

  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: reyel-16-paryaj-session
      description: |
        Mode SPA de Sanctum : appeler `GET /sanctum/csrf-cookie` (hors /api/v1), puis envoyer le cookie
        de session et l'en-tête `X-XSRF-TOKEN` (valeur du cookie XSRF-TOKEN) sur chaque requête.

  schemas:
    Deposit:
      type: object
      description: Dépôt vu par le joueur (V2-B02). Le motif d'une revue reste interne.
      properties:
        reference: { type: string, example: pay_01jbz8k3m2v7q9x4w5r6t0y1ab }
        provider: { type: string, example: fake }
        provider_label: { type: string, example: Paiement test }
        status: { type: string, enum: [pending, succeeded, failed, expired, review] }
        amount: { $ref: "#/components/schemas/Money" }
        redirect_url: { type: [string, "null"], description: Page du prestataire où confirmer ; seulement tant que le dépôt est en attente }
        created_at: { type: string, format: date-time }
        expires_at: { type: [string, "null"], format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
    Withdrawal:
      type: object
      description: |
        Retrait vu par le joueur (V2-B03). Statuts : requested (montant réservé) → first_approved → processing (envoyé
        au prestataire) → paid ou failed ; rejected (refusé par l'administration) et cancelled (annulé par le joueur)
        rendent le montant, comme failed ; review : anomalie du prestataire en cours de vérification. Les motifs de
        refus et de revue restent internes.
      properties:
        reference: { type: string, example: pay_01jc7a2b3c4d5e6f7g8h9j0k1m }
        provider: { type: string, example: plopplop }
        method: { type: string, example: moncash }
        method_label: { type: string, example: MonCash }
        recipient: { type: string, example: "****3456", description: "Numéro du destinataire, masqué sauf les 4 derniers chiffres" }
        status: { type: string, enum: [requested, first_approved, processing, paid, failed, rejected, cancelled, review] }
        amount: { $ref: "#/components/schemas/Money" }
        cancellable: { type: boolean, description: "Vrai aux statuts requested et first_approved" }
        created_at: { type: string, format: date-time }
        completed_at: { type: [string, "null"], format: date-time, description: "Versé, échoué, refusé ou annulé" }
    LedgerEntry:
      type: object
      properties:
        id: { type: string }
        type: { type: string, enum: [simulated_credit, deposit, withdrawal, stake, payout, refund, reversal] }
        amount: { $ref: "#/components/schemas/Money" }
        balance_after: { $ref: "#/components/schemas/Money" }
        related: { type: [object, "null"], properties: { type: { type: string, example: bet }, id: { type: string } } }
        description: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
    ResponsibleGamingLimit:
      type: object
      properties:
        amount: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }], description: "null : aucune limite" }
        used: { $ref: "#/components/schemas/Money" }
        remaining: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }] }
        pending:
          type: [object, "null"]
          description: Hausse ou suppression en attente du délai de réflexion
          properties:
            amount: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }], description: "null : suppression" }
            effective_at: { type: string, format: date-time }
    ResponsibleGaming:
      type: object
      properties:
        limits:
          type: object
          properties:
            day: { $ref: "#/components/schemas/ResponsibleGamingLimit" }
            week: { $ref: "#/components/schemas/ResponsibleGamingLimit" }
            month: { $ref: "#/components/schemas/ResponsibleGamingLimit" }
        deposit_limits:
          type: object
          description: Limites de dépôt (V2-B06) ; used = dépôts de la période glissante
          properties:
            day: { $ref: "#/components/schemas/ResponsibleGamingLimit" }
            week: { $ref: "#/components/schemas/ResponsibleGamingLimit" }
            month: { $ref: "#/components/schemas/ResponsibleGamingLimit" }
        loss_limits:
          type: object
          description: Limites de pertes (V2-E06) ; used = perte nette de la période glissante
          properties:
            day: { $ref: "#/components/schemas/ResponsibleGamingLimit" }
            week: { $ref: "#/components/schemas/ResponsibleGamingLimit" }
            month: { $ref: "#/components/schemas/ResponsibleGamingLimit" }
        session:
          type: object
          description: Rappel de durée de session (V2-E06)
          properties:
            reminder_minutes: { type: [integer, "null"], example: 30, description: "null : désactivé" }
            started_at: { type: [string, "null"], format: date-time, description: "Heure de la connexion ; null dans la vue de la Conformité" }
        pause:
          type: object
          properties:
            active: { type: boolean }
            ends_at: { type: [string, "null"], format: date-time }
        options:
          type: object
          properties:
            pause_durations: { type: array, items: { type: string }, example: ["24h", "7d", "30d"] }
            exclusion_durations: { type: array, items: { type: string }, example: ["6m", "1y", "5y"] }
            limit_increase_delay_days: { type: integer, example: 7 }
            session_reminder_minutes: { type: array, items: { type: integer }, example: [15, 30, 60] }
    SpendingTotals:
      type: object
      description: Totaux d'une période (V2-E06), montants positifs sauf net
      properties:
        deposits: { $ref: "#/components/schemas/Money" }
        withdrawals: { $ref: "#/components/schemas/Money" }
