          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422": { description: "`regulation_time_required` (football : confirmer le score du temps réglementaire), `invalid_result` ou `validation_failed`", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
