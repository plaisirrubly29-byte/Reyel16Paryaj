openapi: 3.1.0
info:
  title: REYEL 16 PAYAJ API
  version: 1.0.0-draft
  description: |
    Contrat de l'API v1. Toute route doit être documentée ici AVANT l'intégration frontend.
    Les routes marquées `x-task` ne sont pas encore implémentées.
servers:
  - url: http://localhost:8000/api/v1
    description: Développement local

tags:
  - name: System
  - name: Auth
  - name: Catalogue
  - name: Bets
  - name: Wallet
  - name: Admin

paths:
  /health:
    get:
      tags: [System]
      summary: État de l'API
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  version: { type: string, example: v1 }
                  time: { type: string, format: date-time }

  /auth/register:
    post: { tags: [Auth], summary: Inscription, x-task: P2-02, responses: { "201": { description: Créé } } }
  /auth/login:
    post: { tags: [Auth], summary: Connexion, x-task: P2-02, responses: { "200": { description: OK } } }
  /auth/logout:
    post: { tags: [Auth], summary: Déconnexion, x-task: P2-02, responses: { "204": { description: OK } } }
  /me:
    get: { tags: [Auth], summary: Utilisateur connecté, x-task: P2-02, responses: { "200": { description: OK } } }

  /sports:
    get: { tags: [Catalogue], summary: Liste des sports, x-task: P3-05, responses: { "200": { description: OK } } }
  /competitions:
    get: { tags: [Catalogue], summary: Liste des compétitions, x-task: P3-05, responses: { "200": { description: OK } } }
  /events:
    get: { tags: [Catalogue], summary: Événements ouverts aux paris, y compris en direct, x-task: P3-05, responses: { "200": { description: OK } } }
  /events/{id}/markets:
    get:
      tags: [Catalogue]
      summary: Tous les marchés et cotes disponibles d'un événement
      description: |
        Renvoie tous les marchés ouverts fournis pour cet événement, sans limiter les types
        (résultat, buts, score exact, joueurs, etc.). Les marchés indisponibles ou périmés
        ne doivent pas être proposés comme pariables.
      x-task: P3-05
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: Match et marchés actuellement disponibles
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/EventMarkets"
        "404": { description: Événement introuvable ou plus proposé }

  /bets:
    post:
      tags: [Bets]
      summary: Placer un pari (simulé en V1)
      x-task: P4-03
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201": { description: Ticket créé (reçu immuable) }
        "409": { description: Cote changée — confirmation requise }
        "422": { description: Marché fermé, limites, solde insuffisant }
    get: { tags: [Bets], summary: Mes tickets, x-task: P4-04, responses: { "200": { description: OK } } }
  /bets/{id}:
    get:
      tags: [Bets]
      summary: Détail d'un ticket
      x-task: P4-04
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK }, "404": { description: Introuvable ou non autorisé } }

  /wallet:
    get: { tags: [Wallet], summary: Solde, x-task: P5-03, responses: { "200": { description: OK } } }
  /wallet/transactions:
    get: { tags: [Wallet], summary: Historique des écritures, x-task: P5-03, responses: { "200": { description: OK } } }

  /admin/events/{id}:
    patch:
      tags: [Admin]
      summary: Modifier l'état d'un événement (motif requis)
      x-task: P6-02
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK }, "403": { description: Permission refusée } }
  /admin/markets/{id}:
    patch:
      tags: [Admin]
      summary: Suspendre / masquer un marché (motif requis)
      x-task: P6-02
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK }, "403": { description: Permission refusée } }
  /admin/users/{id}:
    patch:
      tags: [Admin]
      summary: Suspendre un compte (motif requis)
      x-task: P6-03
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK }, "403": { description: Permission refusée } }

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID unique par intention utilisateur. Une requête rejouée renvoie la même réponse.
      schema: { type: string, format: uuid }
  schemas:
    EventMarkets:
      type: object
      required: [id, sport, competition, home_team, away_team, starts_at, status, markets]
      properties:
        id: { type: string }
        sport:
          type: object
          required: [slug, name]
          properties:
            slug: { type: string }
            name: { type: string }
        competition:
          type: object
          required: [id, name, country]
          properties:
            id: { type: string }
            name: { type: string }
            country: { type: [string, "null"] }
        home_team: { type: string }
        away_team: { type: string }
        starts_at: { type: string, format: date-time }
        status: { type: string, description: État normalisé de l'événement }
        markets:
          type: array
          items: { $ref: "#/components/schemas/EventMarket" }
    EventMarket:
      type: object
      description: Marché générique; key et name permettent les types proposés par le fournisseur.
      required: [id, key, name, odds_version, odds_updated_at, bettable, selections]
      properties:
        id: { type: string }
        key: { type: string, example: exact_score }
        name: { type: string, example: Score exact }
        line: { type: [string, "null"], example: "2.5" }
        odds_version: { type: integer }
        odds_updated_at: { type: string, format: date-time }
        bettable: { type: boolean }
        selections:
          type: array
          items: { $ref: "#/components/schemas/MarketSelection" }
    MarketSelection:
      type: object
      required: [id, key, label, name, odds]
      properties:
        id: { type: string }
        key: { type: string, example: score }
        label: { type: string, example: "2-1" }
        name: { type: string, example: Arsenal 2-1 Chelsea }
        odds: { type: string, pattern: '^\d+(\.\d+)?$', example: "8.50" }
    Money:
      type: object
      description: Montant en unité mineure (entier) — jamais de nombre décimal.
      properties:
        minor: { type: integer, example: 10050 }
        currency: { type: string, example: HTG }
