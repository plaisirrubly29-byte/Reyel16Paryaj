openapi: 3.1.0
info:
  title: REYEL 16 PAYAJ API
  version: 1.0.0-draft
  description: |
    Contrat de l'API v1. Toute route doit être documentée ici AVANT l'intégration frontend.
    Les routes marquées `x-task` ne sont pas encore implémentées.
servers:
  - url: http://localhost:8000/api/v1
    description: Développement local

tags:
  - name: System
  - name: Auth
  - name: Catalogue
  - name: Bets
  - name: Wallet
  - name: Admin

paths:
  /health:
    get:
      tags: [System]
      summary: État de l'API
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  version: { type: string, example: v1 }
                  time: { type: string, format: date-time }

  /auth/register:
    post: { tags: [Auth], summary: Inscription, x-task: P2-02, responses: { "201": { description: Créé } } }
  /auth/login:
    post: { tags: [Auth], summary: Connexion, x-task: P2-02, responses: { "200": { description: OK } } }
  /auth/logout:
    post: { tags: [Auth], summary: Déconnexion, x-task: P2-02, responses: { "204": { description: OK } } }
  /me:
    get: { tags: [Auth], summary: Utilisateur connecté, x-task: P2-02, responses: { "200": { description: OK } } }

  /sports:
    get:
      tags: [Catalogue]
      summary: Sports ayant des matchs ouverts, avec leurs compétitions
      description: Public. Seuls les matchs dont un marché est ouvert et à jour sont comptés (règle de fraîcheur).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        slug: { type: string, example: soccer }
                        name: { type: string, example: Football }
                        events_count: { type: integer }
                        competitions:
                          type: array
                          items:
                            type: object
                            properties:
                              id: { type: string }
                              name: { type: string, example: EPL }
                              country: { type: [string, "null"] }
                              events_count: { type: integer }
  /competitions:
    get:
      tags: [Catalogue]
      summary: Compétitions ayant des matchs ouverts
      parameters:
        - { name: sport, in: query, schema: { type: string, example: soccer } }
      responses:
        "200": { description: OK }
  /events:
    get:
      tags: [Catalogue]
      summary: Matchs à venir avec leur marché principal (1X2), triés par heure de début
      description: |
        Public. Un match n'apparaît que s'il est programmé, pas encore commencé et qu'un marché est ouvert
        avec une cote assez récente (SPORTS_DATA_MAX_ODDS_AGE). Cotes en chaînes décimales.
      parameters:
        - { name: sport, in: query, schema: { type: string, example: soccer } }
        - { name: competition, in: query, schema: { type: integer } }
        - { name: date, in: query, schema: { type: string, format: date } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/CatalogueEvent" } }
                  links: { type: object }
                  meta: { type: object }
        "422": { description: Paramètres invalides }
  /events/{id}/markets:
    get:
      tags: [Catalogue]
      summary: Détail d'un match et de tous ses marchés pariables
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/CatalogueEvent" } } } } }
        "404": { description: Match inconnu ou plus proposé }

  /bets:
    post:
      tags: [Bets]
      summary: Placer un pari (simulé en V1)
      x-task: P4-03
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201": { description: Ticket créé (reçu immuable) }
        "409": { description: Cote changée — confirmation requise }
        "422": { description: Marché fermé, limites, solde insuffisant }
    get: { tags: [Bets], summary: Mes tickets, x-task: P4-04, responses: { "200": { description: OK } } }
  /bets/{id}:
    get:
      tags: [Bets]
      summary: Détail d'un ticket
      x-task: P4-04
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK }, "404": { description: Introuvable ou non autorisé } }

  /wallet:
    get: { tags: [Wallet], summary: Solde, x-task: P5-03, responses: { "200": { description: OK } } }
  /wallet/transactions:
    get: { tags: [Wallet], summary: Historique des écritures, x-task: P5-03, responses: { "200": { description: OK } } }

  /admin/events/{id}:
    patch:
      tags: [Admin]
      summary: Modifier l'état d'un événement (motif requis)
      x-task: P6-02
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK }, "403": { description: Permission refusée } }
  /admin/markets/{id}:
    patch:
      tags: [Admin]
      summary: Suspendre / masquer un marché (motif requis)
      x-task: P6-02
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK }, "403": { description: Permission refusée } }
  /admin/users/{id}:
    patch:
      tags: [Admin]
      summary: Suspendre un compte (motif requis)
      x-task: P6-03
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK }, "403": { description: Permission refusée } }

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID unique par intention utilisateur. Une requête rejouée renvoie la même réponse.
      schema: { type: string, format: uuid }
  schemas:
    CatalogueEvent:
      type: object
      properties:
        id: { type: string }
        sport: { type: object, properties: { slug: { type: string }, name: { type: string } } }
        competition: { type: object, properties: { id: { type: string }, name: { type: string }, country: { type: [string, "null"] } } }
        home_team: { type: string }
        away_team: { type: string }
        starts_at: { type: string, format: date-time }
        status: { type: string, enum: [scheduled] }
        markets:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              key: { type: string, example: h2h }
              name: { type: string, example: Résultat du match (1X2) }
              odds_version: { type: integer, description: "À renvoyer avec le pari ; le serveur refuse une version périmée (P4-03)" }
              odds_updated_at: { type: string, format: date-time }
              selections:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    key: { type: string, enum: [home, draw, away] }
                    label: { type: string, enum: ["1", "X", "2"] }
                    name: { type: string, example: Arsenal }
                    odds: { type: string, example: "2.10", description: Cote décimale en chaîne (jamais de float) }
    Money:
      type: object
      description: Montant en unité mineure (entier) — jamais de nombre décimal.
      properties:
        minor: { type: integer, example: 10050 }
        currency: { type: string, example: HTG }
