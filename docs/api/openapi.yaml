                  meta: { $ref: "#/components/schemas/PaginationMeta" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      tags: [Complaints]
      summary: Ouvrir une réclamation (numéro unique, pièces jointes facultatives)
      description: |
        V2-G04. multipart/form-data. Lien facultatif vers un ticket (bet_id) ou une écriture du portefeuille
        (ledger_entry_id) **du joueur** : un identifiant d'un autre joueur ou inconnu donne 422 complaint_link_invalid,
        sans révéler s'il existe. Au plus un des deux liens. Le lien vers un agent viendra avec V2-G01.
        Pièces : 5 au plus, 5 Mo chacune, jpg, jpeg, png, webp ou pdf ; chiffrées par le serveur, visibles du joueur et
        des administrateurs complaints.view (chaque ouverture par un administrateur est auditée).
        Statut initial : new. Numéro lisible : REC-AAAA-NNNNNN (séquence par année).
        Limite : 5 réclamations par heure et par joueur (429). Réservé aux joueurs (422 not_a_player pour un administrateur).
      x-task: V2-G04
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [category, subject, description]
              properties:
                category: { type: string, enum: [bet, transaction, account, other] }
                subject: { type: string, minLength: 5, maxLength: 120 }
                description: { type: string, minLength: 20, maxLength: 5000 }
                bet_id: { type: string, description: Ticket du joueur concerné }
                ledger_entry_id: { type: string, description: Écriture du portefeuille du joueur concernée }
                attachments[]:
                  type: array
                  maxItems: 5
                  items: { type: string, format: binary }
      responses:
        "201":
          description: Réclamation ouverte (status new)
          content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/ComplaintDetail" } } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422":
          description: validation_failed ; complaint_link_invalid ; not_a_player
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /complaints/{id}:
    get:
      tags: [Complaints]
      summary: Détail d'une réclamation du joueur, avec les réponses et l'historique des statuts
      description: |
        V2-G04. Notes internes de l'équipe jamais renvoyées. Les réponses de l'équipe sont signées « Service client »
        (author.name), sans l'identité de l'administrateur. 404 pour la réclamation d'un autre joueur.
      x-task: V2-G04
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/ComplaintDetail" } } } } }
