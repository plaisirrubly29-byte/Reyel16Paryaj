      description: |
        V2-G04. multipart/form-data, mêmes règles de pièces qu'à l'ouverture. Refusé sur une réclamation closed
        (409 complaint_closed : la rouvrir d'abord). Un message du joueur sur une réclamation resolved ne la rouvre pas.
        Limite : 20 messages par heure et par joueur (429).
      x-task: V2-G04
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
