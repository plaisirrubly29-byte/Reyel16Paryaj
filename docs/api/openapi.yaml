      description: |
        Permission results.enter. Une seule demande en attente par match. La réponse contient l'aperçu de l'impact
        (tickets dont l'issue change, montants). Une correction envoyée par le fournisseur après règlement crée aussi
        une demande (requested_by null), à valider de la même façon.

        **Premier résultat (V2-D04)** : si le fournisseur n'a publié aucun résultat, la demande crée le premier
        (`kind: initial`, `current: null`), au plus tôt 3 h après le coup d'envoi (BETTING_MANUAL_RESULT_MIN_HOURS_AFTER_START).
        Sa validation par un autre administrateur enregistre le résultat (source `manual`) et règle les tickets.
        Si le fournisseur publie entre-temps, la validation est refusée (`result_changed`).

        **Temps réglementaire (D-03)** : pour le football, le score est celui de la fin du temps réglementaire
        (90 min + arrêts de jeu), sans prolongation ni tirs au but ; `regulation_time: true` est exigé pour un résultat `final`.
      x-task: P5-06, V2-D04
      security: [{ sessionCookie: [] }]
      parameters:
