        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: complaint_closed
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /complaints/{id}/reopen:
    post:
      tags: [Complaints]
      summary: Rouvrir sa réclamation resolved ou closed (motif requis)
      description: |
        V2-G04. La réclamation repasse en in_progress. Possible jusqu'à complaints.reopen_window_days (30 jours par
        défaut) après le passage en resolved ; au-delà, 422 complaint_reopen_expired (ouvrir une nouvelle réclamation).
