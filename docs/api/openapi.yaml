        away_team: { type: string }
        starts_at: { type: string, format: date-time }
        status: { type: string, enum: [scheduled, live] }
        score:
          type: [object, "null"]
          description: Score du moment d'un match en cours ; null avant le coup d'envoi ou s'il n'est pas encore connu
          properties:
            home: { type: string, example: "1" }
            away: { type: string, example: "0" }
        markets:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              key: { type: string, enum: [h2h, double_chance, draw_no_bet, totals, alternate_totals, btts, correct_score, spreads, alternate_spreads, team_totals, alternate_team_totals, odd_even] }
              name: { type: string, example: Résultat du match (1X2) }
              line: { type: [string, "null"], example: "2.5", description: "Ligne du plus/moins ou du handicap (celle de l'équipe à domicile, ex. \"-0.5\") ; null pour les autres marchés, dont ceux à plusieurs lignes (ligne dans la clé de la sélection)" }
              odds_version: { type: integer, description: "À renvoyer avec le pari ; le serveur refuse une version périmée (P4-03)" }
              odds_updated_at: { type: string, format: date-time }
