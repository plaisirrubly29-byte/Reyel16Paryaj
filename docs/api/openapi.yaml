openapi: 3.1.0
info:
  title: REYEL 16 PAYAJ API
  version: 1.0.0-draft
  description: |
    Contrat de l'API v1. Toute route doit être documentée ici AVANT l'intégration frontend.
    Les routes marquées `x-task` ne sont pas encore implémentées.

    Conventions (format des réponses, codes d'erreur, pagination, idempotence) : docs/api/README.md.
    Toute erreur suit le schéma `Error`.
servers:
  - url: http://localhost:8000/api/v1
    description: Développement local

tags:
  - name: System
  - name: Auth
  - name: Catalogue
  - name: Lottery
    description: Borlette — tirages et résultats publiés par le fournisseur (404 tant que LOTTERY_ENABLED=false)
  - name: Bets
  - name: Wallet
  - name: ResponsibleGaming
  - name: Complaints
    description: Réclamations du joueur (V2-G04)
  - name: Admin
  - name: Payments

paths:
  /health:
    get:
      tags: [System]
      summary: État de l'API
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  version: { type: string, example: v1 }
                  time: { type: string, format: date-time }

  /auth/register:
    post:
      tags: [Auth]
      summary: Inscription (compte joueur) — ouvre la session
      description: |
        Limité à 5 requêtes/minute par IP. Âge minimum configurable (IDENTITY_MINIMUM_AGE, 18 par défaut).
        V1 (fonds fictifs) : le portefeuille reçoit un crédit de bienvenue (WALLET_WELCOME_CREDIT_MINOR,
        5 000,00 HTG par défaut ; 0 le désactive), visible dans GET /wallet et ses transactions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, phone, password, password_confirmation, birth_date, terms_accepted, terms_version]
              properties:
                name: { type: string, maxLength: 100 }
                phone: { type: string, description: "Numéro haïtien local, 8 chiffres (espaces/tirets et préfixe +509/509 acceptés)", example: "+509 3412-3456" }
                email: { type: [string, "null"], format: email, description: "Optionnel." }
                password: { type: string, minLength: 10, description: "Au moins une lettre et un chiffre" }
                password_confirmation: { type: string }
                birth_date: { type: string, format: date, example: "1998-05-21" }
                country: { type: string, minLength: 2, maxLength: 2, example: HT }
                terms_accepted:
                  type: boolean
                  const: true
                  description: |
                    V2-E01 : case « J'accepte les conditions d'utilisation et le règlement des paris » cochée. Absente ou
                    false : 422 (details.terms_accepted).
                terms_version:
                  type: string
                  example: "2026-11-02"
                  description: |
                    V2-E01 : version des textes affichés au joueur (LEGAL_VERSION du frontend, en tête de /conditions).
                    Le serveur enregistre l'acceptation (version, date, IP). Version différente de la version en vigueur
                    côté serveur : 422 (details.terms_version), le joueur recharge la page.
      responses:
        "201":
          description: Compte créé, session ouverte
          content: { application/json: { schema: { $ref: "#/components/schemas/UserEnvelope" } } }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /auth/login:
    post:
      tags: [Auth]
      summary: Connexion par téléphone ou par email
      description: |
        Fournir `phone` OU `email` (si les deux sont fournis, le téléphone est utilisé).
        Même réponse `422 invalid_credentials` que le compte existe ou non (pas d'énumération).
        Limité à 5 tentatives/minute par identifiant+IP, 20/minute par IP et 30/heure par compte, quelle que soit l'IP
        (compteur commun au téléphone et à l'email d'un même compte).
        Le numéro est normalisé avant d'être compté : `34123456`, `3412-3456` et `+509 3412 3456` partagent les mêmes compteurs ;
        l'email est comparé en minuscules.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                phone: { type: string, example: "34123456" }
                email: { type: string, format: email, example: "chef@example.com" }
                password: { type: string }
      responses:
        "200":
          description: Session ouverte
          content: { application/json: { schema: { $ref: "#/components/schemas/UserEnvelope" } } }
        "422":
          description: "`invalid_credentials` ou `validation_failed`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "423":
          description: "`account_suspended` — compte suspendu ou fermé ; `account_excluded` — auto-exclusion du joueur (jeu responsable)"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Demander un lien de réinitialisation
      description: |
        Réponse 202 identique que le compte existe ou non (pas d'énumération). Le lien envoyé par email
        pointe vers `FRONTEND_URL/reset-password?token=…&email=…`, expire en 30 minutes et sert une seule fois.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email], properties: { email: { type: string, format: email } } }
      responses:
        "202": { description: Demande prise en compte }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Choisir un nouveau mot de passe
      description: Ferme toutes les sessions ouvertes du compte.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, email, password, password_confirmation]
              properties:
                token: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 10 }
                password_confirmation: { type: string }
      responses:
        "200": { description: Mot de passe modifié }
        "422":
          description: "`invalid_reset_token` (jeton invalide, expiré, déjà utilisé ou compte inconnu) ou `validation_failed`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /auth/mfa/setup:
    post:
      tags: [Auth]
      summary: Générer un secret TOTP (MFA admin) — à afficher en QR code
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Secret en attente de confirmation
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      secret: { type: string, example: JBSWY3DPEHPK3PXP }
                      otpauth_uri: { type: string, example: "otpauth://totp/REYEL%2016%20PAYAJ:admin%40example.com?secret=…" }
        "409":
          description: "`mfa_already_enabled`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /auth/mfa/confirm:
    post:
      tags: [Auth]
      summary: Activer le MFA avec un premier code — renvoie 8 codes de secours (affichés une seule fois)
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string, example: "123456" } } } } }
      responses:
        "200":
          description: MFA activé ; session validée
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, properties: { recovery_codes: { type: array, items: { type: string } } } }
        "409":
          description: "`mfa_already_enabled` ou `mfa_setup_required`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: "`invalid_mfa_code`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /auth/mfa/verify:
    post:
      tags: [Auth]
      summary: Valider la session avec un code TOTP ou un code de secours (requis après chaque connexion admin)
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string, example: "123456" }
                recovery_code: { type: string, example: "a1b2c-d3e4f" }
      responses:
        "204": { description: Session validée }
        "401":
          description: "`mfa_too_many_failures` : trop d'échecs consécutifs (5), la session est fermée et il faut se reconnecter"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: "`invalid_mfa_code` (code invalide ou déjà utilisé) ; chaque échec est audité (`mfa.failed`)"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429":
          description: "`too_many_requests` : par compte, 5 essais par minute, 20 par heure et 50 par jour (avec `/auth/mfa/confirm`)"
          headers: { Retry-After: { schema: { type: integer } } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /auth/mfa/recovery-codes:
    post:
      tags: [Auth]
      summary: Régénérer les codes de secours (session MFA validée + code TOTP courant)
      description: |
        Exige un code TOTP courant (pas un code de secours) : une session volée ne suffit pas.
        Régénération auditée (`mfa.recovery_codes_regenerated`).
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, example: "123456" }
      responses:
        "200": { description: Nouveaux codes (les anciens sont invalidés) }
        "401":
          description: "`mfa_too_many_failures` : trop d'échecs consécutifs (5), la session est fermée et il faut se reconnecter"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: "`invalid_mfa_code` (code invalide ou déjà utilisé) ; chaque échec est audité (`mfa.failed`)"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Déconnexion (invalide la session)
      security: [{ sessionCookie: [] }]
      responses:
        "204": { description: Session fermée }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /me:
    get:
      tags: [Auth]
      summary: Utilisateur connecté
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/UserEnvelope" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /me/sessions:
    get:
      tags: [Auth]
      summary: Appareils connectés au compte
      x-task: V2-C06
      description: |
        Sessions ouvertes du compte, l'appareil en cours d'abord. Une session se ferme après SESSION_LIFETIME
        d'inactivité, et au plus tard 12 h après la connexion pour un joueur, 8 h pour un compte administratif.
        Un administrateur inactif depuis 30 min doit saisir un nouveau code MFA (403 mfa_required, data.mfa.verified false dans /me).
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, description: "Empreinte SHA-256 de la session (jamais l'identifiant lui-même)" }
                        ip_address: { type: [string, "null"] }
                        user_agent: { type: [string, "null"] }
                        last_active_at: { type: string, format: date-time }
                        current: { type: boolean, description: Appareil de la requête }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    delete:
      tags: [Auth]
      summary: Déconnecter tous les autres appareils
      x-task: V2-C06
      description: La session en cours reste ouverte. Audité (sessions.revoked) si au moins un appareil est déconnecté.
      security: [{ sessionCookie: [] }]
      responses:
        "204": { description: Autres appareils déconnectés }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /me/sessions/{session}:
    delete:
      tags: [Auth]
      summary: Déconnecter un autre appareil
      x-task: V2-C06
      description: Audité (sessions.revoked). La session en cours se ferme avec POST /auth/logout.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: session, in: path, required: true, schema: { type: string }, description: "id renvoyé par GET /me/sessions" }
      responses:
        "204": { description: Appareil déconnecté }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: "not_found — aucun appareil de ce compte avec cet id"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: "current_session — c'est l'appareil en cours"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /sports:
    get:
      tags: [Catalogue]
      summary: Sports ayant des matchs ouverts, avec leurs compétitions
      description: Public. Seuls les matchs dont un marché est ouvert et à jour sont comptés (règle de fraîcheur).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        slug: { type: string, example: soccer }
                        name: { type: string, example: Football }
                        events_count: { type: integer }
                        competitions:
                          type: array
                          items:
                            type: object
                            properties:
                              id: { type: string }
                              name: { type: string, example: EPL }
                              country: { type: [string, "null"] }
                              events_count: { type: integer }
  /competitions:
    get:
      tags: [Catalogue]
      summary: Compétitions ayant des matchs ouverts
      parameters:
        - { name: sport, in: query, schema: { type: string, example: soccer } }
      responses:
        "200": { description: OK }
  /events:
    get:
      tags: [Catalogue]
      summary: Matchs en cours et à venir avec un marché affiché (1X2 par défaut), triés par heure de début
      description: |
        Public. Un match apparaît s'il est programmé et pas encore commencé, ou en cours (status "live", avec son
        score), et qu'un marché est ouvert et coté. Une cote trop ancienne (SPORTS_DATA_MAX_ODDS_AGE, ou
        SPORTS_DATA_MAX_LIVE_ODDS_AGE pendant le match) est affichée mais non pariable. Cotes en chaînes décimales.
      parameters:
        - { name: sport, in: query, schema: { type: string, example: soccer } }
        - { name: competition, in: query, schema: { type: integer } }
        - { name: date, in: query, schema: { type: string, format: date } }
        - name: market
          in: query
          description: Marché affiché dans la liste. Un match qui ne le propose pas est listé avec `markets` vide.
          schema: { type: string, enum: [h2h, double_chance, totals, btts], default: h2h }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/CatalogueEvent" } }
                  links: { type: object }
                  meta: { type: object }
        "422": { description: Paramètres invalides }
  /events/{id}/markets:
    get:
      tags: [Catalogue]
      summary: Détail d'un match et de tous ses marchés pariables
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/CatalogueEvent" } } } } }
        "404": { description: Match inconnu ou plus proposé }

  /lottery/draws:
    get:
      tags: [Lottery]
      summary: Tirages de borlette actifs, avec le prochain tirage et le dernier résultat
      description: |
        Public. Tirages proposés par le fournisseur (ex. New York Midi, Floride Soir), triés par heure locale.
        Répond 404 tant que la borlette n'est pas activée (LOTTERY_ENABLED=false).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/LotteryDraw" } }
        "404": { $ref: "#/components/responses/NotFound" }
  /lottery/results:
    get:
      tags: [Lottery]
      summary: Résultats publiés des tirages, du plus récent au plus ancien
      description: |
        Public. Un résultat n'est publié qu'après l'heure du tirage et n'est jamais modifié par la synchronisation.
        Répond 404 tant que la borlette n'est pas activée (LOTTERY_ENABLED=false).
      parameters:
        - { name: draw, in: query, description: Clé du tirage (voir /lottery/draws), schema: { type: string, example: ny_midday } }
        - { name: date, in: query, description: Date locale du tirage, schema: { type: string, format: date } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/LotteryResult" } }
                  links: { type: object }
                  meta: { type: object }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /lottery/games:
    get:
      tags: [Lottery]
      summary: Jeux en vente, avec leurs options, mises min/max et barème des gains
      description: |
        V2-D09. Public. `sales_open` false et `games` vide tant que la vente est fermée : interrupteur
        LOTTERY_SALES_ENABLED coupé, ou barème absent de config/lottery.php (décision D-12). Un jeu sans barème
        n'est pas listé. Le gain d'une ligne = mise × multiplicateur du lot gagnant (arrondi au centime inférieur).
        Répond 404 tant que la borlette n'est pas activée (LOTTERY_ENABLED=false).
      x-task: V2-D09
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      sales_open: { type: boolean }
                      close_before_minutes: { type: integer, minimum: 0, description: "Fin des ventes, en minutes avant l'heure du tirage" }
                      max_plays_per_ticket: { type: integer, minimum: 1 }
                      games: { type: array, items: { $ref: "#/components/schemas/LotteryGame" } }
        "404": { $ref: "#/components/responses/NotFound" }
  /lottery/tickets:
    get:
      tags: [Lottery]
      summary: Fiches de borlette du joueur connecté (plus récentes d'abord)
      x-task: V2-D09
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, won, lost, void] } }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/LotteryTicket" } }
                  links: { $ref: "#/components/schemas/PaginationLinks" }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Lottery]
      summary: Valider une fiche de borlette pour le prochain tirage ouvert (mise débitée)
      description: |
        V2-D09. Une fiche = un tirage, une date, 1 à max_plays_per_ticket lignes. Tout ou rien : une ligne refusée
        refuse la fiche, rien n'est débité.

        - **Tirage** : `draw` = clé du tirage. Sans `date`, la fiche vise la prochaine occurrence encore ouverte
          (aujourd'hui, ou le prochain jour du tirage). Avec `date` (date locale du tirage), elle doit être cette
          occurrence-là ; sinon 409 lottery_draw_closed (details.next_date) : le joueur ne joue jamais pour un autre
          jour sans le savoir.
        - **Fin des ventes** : heure du tirage − close_before_minutes (heure d'Haïti).
        - **Lignes** : `numbers` en chaînes (« 07 » garde son zéro). bolet : 1 boule de 2 chiffres ; maryaj : 2 boules
          de 2 chiffres différentes ; loto3 : 3 chiffres ; loto4 : 4 chiffres et option 1, 2 ou 3 ; loto5 : 5 chiffres
          et option 1 ou 2. `option` null pour les autres jeux.
        - **Mises** : chaque ligne entre min_stake et max_stake de son jeu ; devise du portefeuille.
        - **Contrôles, dans la transaction et sous verrou** : jeu responsable (pause, limites de mise, comme un pari
          sportif), solde, boules bloquées (422 lottery_number_blocked), plafond d'engagement par boule, tirage et
          date (422 lottery_number_limit, details.remaining_stake = mise encore acceptée sur cette boule).
        - **Ledger** : une écriture `stake` du total (related type lottery_ticket).

        Clé d'idempotence obligatoire : un rejeu renvoie la même fiche (200) ; la même clé pour une autre fiche donne
        409 idempotency_key_reused.
      x-task: V2-D09
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [draw, plays]
              properties:
                draw: { type: string, example: NYM }
                date: { type: string, format: date, description: "Date locale du tirage visée (facultative, conseillée)" }
                plays:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [game, numbers, stake]
                    properties:
                      game: { type: string, enum: [bolet, maryaj, loto3, loto4, loto5] }
                      option: { type: [integer, "null"], minimum: 1, maximum: 3 }
                      numbers: { type: array, minItems: 1, maxItems: 2, items: { type: string, pattern: "^[0-9]{2,5}$" } }
                      stake: { $ref: "#/components/schemas/Money" }
            example:
              draw: NYM
              date: "2026-11-12"
              plays:
                - { game: bolet, option: null, numbers: ["25"], stake: { minor: 5000, currency: HTG } }
                - { game: maryaj, option: null, numbers: ["25", "07"], stake: { minor: 2000, currency: HTG } }
                - { game: loto4, option: 1, numbers: ["2507"], stake: { minor: 1000, currency: HTG } }
      responses:
        "200":
          description: Rejeu d'une fiche déjà acceptée avec la même clé
          content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/LotteryTicket" } } } } }
        "201":
          description: Fiche acceptée, mise débitée
          content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/LotteryTicket" } } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: lottery_sales_closed (vente fermée ou barème absent) ; betting_paused (pause ou auto-exclusion)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: lottery_draw_closed (details.next_date, details.closes_at) ; idempotency_key_reused
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: |
            validation_failed (details par ligne : plays.0.numbers…) ; lottery_draw_unknown ; insufficient_funds ;
            stake_limit_exceeded (jeu responsable) ; lottery_number_blocked (details.play, details.numbers) ;
            lottery_number_limit (details.play, details.numbers, details.remaining_stake) ; not_a_player
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "428": { description: En-tête Idempotency-Key manquant }
  /lottery/tickets/{id}:
    get:
      tags: [Lottery]
      summary: Détail d'une fiche de borlette du joueur, avec le résultat du tirage une fois publié
      x-task: V2-D09
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/LotteryTicket" } } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /bets:
    post:
      tags: [Bets]
      summary: Placer un pari (simulé en V1)
      x-task: P4-03
      description: |
        Le serveur recharge les marchés et applique SES cotes : la cote envoyée ne sert qu'à détecter un changement.
        Ticket, sélections figées et réservation de la mise sont créés dans une seule transaction.
        Règles validées (config/betting.php, décisions D-04/D-05/D-06) : mise 10,00 à 50 000,00, gain plafonné
        à 1 000 000,00, combinés de 20 sélections au plus et une seule sélection par match, toute cote changée refusée.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stake, selections]
              properties:
                stake:
                  type: object
                  required: [minor]
                  properties:
                    minor: { type: integer, minimum: 1, example: 10000, description: Mise en unité mineure (centimes) }
                    currency: { type: string, example: HTG, description: "Facultatif ; doit être la devise du portefeuille" }
                selections:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: object
                    required: [selection_id, odds]
                    properties:
                      selection_id: { type: integer, example: 462 }
                      odds: { type: string, example: "2.10", description: Cote vue par le joueur (détection de changement) }
      responses:
        "201":
          description: Ticket créé (reçu immuable)
          content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/BetTicket" } } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409":
          description: |
            odds_changed — cote changée, rien n'est créé. details.selections : [{ selection_id, odds, odds_version }]
            avec la cote actuelle ; le joueur confirme en renvoyant le pari avec ces cotes (nouvelle clé d'idempotence).
            idempotency_key_reused — clé déjà utilisée pour un autre pari. La clé est figée sur le ticket : rejouer
            le même pari avec la même clé (même après une panne du serveur) renvoie le ticket existant, sans seconde mise.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: |
            validation_failed ; selection_unavailable (details.selection_ids : match commencé, en direct (paris en
            direct désactivés par défaut) ou terminé, marché fermé, cote trop ancienne) ; same_event_selections ;
            multiple_not_allowed ; stake_out_of_range (details.min / max ; max tient compte de la mise maximale posée
            par un administrateur pour ce joueur, V2-D05) ; currency_mismatch ; insufficient_funds ;
            jeu responsable (P7-02, journalisé) : betting_paused (details.ends_at), stake_limit_exceeded (details.period,
            limit_minor, remaining_minor) ; loss_limit_exceeded (V2-E06 : si le pari est perdu, la perte nette de la
            période dépasserait la limite du joueur ; mêmes details) ; risk_limit_exceeded (V2-D05 : le pari ferait dépasser la perte maximale
            acceptée sur le match ou le marché ; details.scope event|market, details.event_id ; ni plafond ni
            exposition ne sont communiqués).
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "423": { description: "Compte suspendu ou fermé, ou portefeuille gelé" }
        "428": { description: En-tête Idempotency-Key manquant }
        "429":
          description: "too_many_requests — plus de 10 paris par minute pour ce joueur (BETTING_MAX_BETS_PER_MINUTE, V2-C06) ; en-tête Retry-After"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    get:
      tags: [Bets]
      summary: Mes tickets (plus récents d'abord)
      description: Tickets du joueur connecté uniquement, avec leurs sélections.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, won, lost, void] } }
        - { name: type, in: query, schema: { type: string, enum: [single, multiple] } }
        - { name: days, in: query, description: Tickets placés depuis N jours, schema: { type: integer, enum: [1, 7, 30, 90] } }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/BetTicket" } }
                  links: { $ref: "#/components/schemas/PaginationLinks" }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "423": { description: Compte suspendu ou fermé }
  /bets/{id}:
    get:
      tags: [Bets]
      summary: Reçu d'un ticket
      description: Le ticket d'un autre joueur répond 404, comme un ticket inexistant (sans révéler qu'il existe).
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
