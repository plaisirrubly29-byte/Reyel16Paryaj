      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 5, maxLength: 500 } } } } }
      responses:
        "200":
          description: Correction refusée (status rejected)
          content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/FinanceCorrection" } } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`correction_not_pending`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422": { $ref: "#/components/responses/ValidationError" }

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID unique par intention utilisateur. Une requête rejouée renvoie la même réponse.
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      description: Taille de page, bornée à 100.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    ValidationError:
      description: Données invalides
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              code: validation_failed
              message: Les données envoyées sont invalides.
              details: { phone: ["Le champ phone est obligatoire."] }
    Unauthenticated:
      description: Authentification requise
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: unauthenticated, message: Authentification requise. } }
    Forbidden:
      description: Permission refusée
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: forbidden, message: Action non autorisée. } }
    NotFound:
      description: Introuvable (ou non autorisé, sans révéler l'existence)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: not_found, message: Ressource introuvable. } }
    TooManyRequests:
      description: Trop de tentatives
      headers:
        Retry-After: { schema: { type: integer }, description: Secondes avant de réessayer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: too_many_requests, message: Trop de tentatives. Réessayez plus tard. } }

  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: reyel-16-paryaj-session
      description: |
        Mode SPA de Sanctum : appeler `GET /sanctum/csrf-cookie` (hors /api/v1), puis envoyer le cookie
        de session et l'en-tête `X-XSRF-TOKEN` (valeur du cookie XSRF-TOKEN) sur chaque requête.

  schemas:
    LedgerEntry:
      type: object
      properties:
        id: { type: string }
        type: { type: string, enum: [simulated_credit, stake, payout, refund, reversal] }
        amount: { $ref: "#/components/schemas/Money" }
        balance_after: { $ref: "#/components/schemas/Money" }
        related: { type: [object, "null"], properties: { type: { type: string, example: bet }, id: { type: string } } }
        description: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
    ResponsibleGamingLimit:
      type: object
      properties:
        amount: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }], description: "null : aucune limite" }
        used: { $ref: "#/components/schemas/Money" }
        remaining: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }] }
        pending:
          type: [object, "null"]
          description: Hausse ou suppression en attente du délai de réflexion
          properties:
            amount: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }], description: "null : suppression" }
            effective_at: { type: string, format: date-time }
    ResponsibleGaming:
      type: object
      properties:
        limits:
          type: object
          properties:
            day: { $ref: "#/components/schemas/ResponsibleGamingLimit" }
            week: { $ref: "#/components/schemas/ResponsibleGamingLimit" }
            month: { $ref: "#/components/schemas/ResponsibleGamingLimit" }
        pause:
          type: object
          properties:
            active: { type: boolean }
            ends_at: { type: [string, "null"], format: date-time }
        options:
          type: object
          properties:
            pause_durations: { type: array, items: { type: string }, example: ["24h", "7d", "30d"] }
            exclusion_durations: { type: array, items: { type: string }, example: ["6m", "1y", "5y"] }
            limit_increase_delay_days: { type: integer, example: 7 }
    AdminResponsibleGaming:
      type: object
      properties:
        user: { type: object, properties: { id: { type: string }, status: { type: string, enum: [active, suspended, excluded, closed] } } }
        limits: { $ref: "#/components/schemas/ResponsibleGaming/properties/limits" }
        pause: { $ref: "#/components/schemas/ResponsibleGaming/properties/pause" }
        restrictions:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              type: { type: string, enum: [pause, self_exclusion] }
              duration: { type: string, example: 6m }
              starts_at: { type: string, format: date-time }
              ends_at: { type: string, format: date-time }
              ended: { type: boolean }
              lifted:
                type: [object, "null"]
                properties: { at: { type: string, format: date-time }, by: { type: string }, reason: { type: string } }
        events:
          type: array
          items:
            type: object
            properties:
              type: { type: string, example: limit.lowered }
              data: { type: [object, "null"] }
              actor_id: { type: [string, "null"], description: "null : action du joueur ou du système" }
              created_at: { type: string, format: date-time }
    DailySeries:
      type: array
      description: Une valeur par jour, du plus ancien au plus récent.
      items: { type: object, properties: { date: { type: string, format: date }, value: { type: integer } } }
    AdminUser:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        phone: { type: string, example: "34123456" }
        email: { type: [string, "null"] }
        status: { type: string, enum: [active, suspended, excluded, closed] }
        status_changed_at: { type: [string, "null"], format: date-time }
        is_admin: { type: boolean }
        created_at: { type: string, format: date-time }
        last_login_at: { type: [string, "null"], format: date-time }
        roles: { type: array, items: { type: string }, description: "Avec users.view_personal_data uniquement" }
        mfa_enabled: { type: boolean, description: "Avec users.view_personal_data uniquement" }
        profile: { type: object, description: "Avec users.view_personal_data uniquement" }
    AdminEvent:
      type: object
      properties:
        id: { type: string }
        sport: { type: object, properties: { slug: { type: string }, name: { type: string } } }
        competition: { type: object, properties: { id: { type: string }, name: { type: string }, country: { type: [string, "null"] } } }
        home_team: { type: string }
        away_team: { type: string }
        starts_at: { type: string, format: date-time }
        status: { type: string, enum: [scheduled, live, finished, postponed, cancelled] }
        score: { type: [object, "null"], properties: { home: { type: string }, away: { type: string } } }
        origin: { type: object, properties: { provider: { type: string, example: the_odds_api }, external_id: { type: string } } }
        last_synced_at: { type: [string, "null"], format: date-time }
        result_received_at: { type: [string, "null"], format: date-time }
        markets_count:
          type: object
          description: Nombre de marchés par statut
          properties: { open: { type: integer }, suspended: { type: integer }, closed: { type: integer }, settled: { type: integer } }
        markets: { type: array, items: { $ref: "#/components/schemas/AdminMarket" }, description: "Détail uniquement" }
    AdminMarket:
      type: object
      properties:
        id: { type: string }
        event_id: { type: string }
        key: { type: string, example: h2h }
        name: { type: string, example: Résultat du match (1X2) }
        line: { type: [string, "null"], example: "2.5" }
        status: { type: string, enum: [open, suspended, closed, settled] }
        suspension:
          type: [object, "null"]
          properties:
            automatic: { type: boolean, description: "true : posée par la synchronisation (cotes périmées), levée par des cotes fraîches" }
            reason: { type: string }
        odds_version: { type: integer }
        origin: { type: object, properties: { provider: { type: string }, external_id: { type: string }, bookmaker: { type: [string, "null"] } } }
        freshness:
          type: object
          properties:
            odds_updated_at: { type: [string, "null"], format: date-time }
            age_seconds: { type: [integer, "null"] }
            max_age_minutes: { type: integer, description: "Règle de fraîcheur (plus courte pendant le match)" }
            stale: { type: boolean }
        bettable: { type: boolean }
        selections:
          type: array
          items: { type: object, properties: { id: { type: string }, key: { type: string }, label: { type: string }, name: { type: string }, odds: { type: string, example: "2.10" } } }
        updated_at: { type: [string, "null"], format: date-time }
    AuditLog:
      type: object
      properties:
        id: { type: string }
        action: { type: string, example: roles.updated }
        actor: { type: [object, "null"], properties: { id: { type: string }, email: { type: string } } }
        subject: { type: [object, "null"], properties: { type: { type: string }, id: { type: string } } }
        before: { type: [object, "null"] }
        after: { type: [object, "null"] }
        reason: { type: [string, "null"] }
        metadata: { type: [object, "null"] }
        ip_address: { type: [string, "null"] }
        request_id: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
    User:
      type: object
      properties:
        id: { type: string, example: "42" }
        name: { type: string }
        phone: { type: string, example: "34123456", description: "Identifiant de connexion, 8 chiffres." }
        email: { type: [string, "null"], format: email }
        status: { type: string, enum: [active, suspended, excluded, closed] }
        roles:
          type: array
          items: { type: string, enum: [super_admin, operations, finance, support, compliance] }
          description: Vide pour un joueur.
        permissions:
          type: array
          items: { type: string, example: users.view }
          description: Permissions effectives (config/permissions.php). Sert à afficher le menu admin ; l'API vérifie chaque route.
        is_admin: { type: boolean }
        mfa:
          type: object
          description: Le frontend redirige un admin vers l'activation (enabled=false) ou la saisie du code (verified=false).
          properties:
            enabled: { type: boolean }
            verified: { type: boolean }
            required: { type: boolean }
        profile:
          type: [object, "null"]
          properties:
            first_name: { type: [string, "null"] }
            last_name: { type: [string, "null"] }
            birth_date: { type: [string, "null"], format: date }
            country: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
    UserEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/User" }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Identifiant stable (snake_case) sur lequel le client se base.
              example: validation_failed
            message:
              type: string
              description: Message lisible, affichable tel quel.
            details:
              type: object
              additionalProperties: true
              description: Informations complémentaires (ex. erreurs par champ).
    PaginationLinks:
      type: object
      properties:
        first: { type: [string, "null"] }
        last: { type: [string, "null"] }
        prev: { type: [string, "null"] }
        next: { type: [string, "null"] }
    PaginationMeta:
      type: object
      properties:
        current_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        last_page: { type: integer }
        from: { type: [integer, "null"] }
        to: { type: [integer, "null"] }
        path: { type: string }
    CatalogueEvent:
      type: object
      properties:
        id: { type: string }
        sport: { type: object, properties: { slug: { type: string }, name: { type: string } } }
        competition: { type: object, properties: { id: { type: string }, name: { type: string }, country: { type: [string, "null"] } } }
        home_team: { type: string }
        away_team: { type: string }
        starts_at: { type: string, format: date-time }
        status: { type: string, enum: [scheduled, live] }
        score:
          type: [object, "null"]
          description: Score du moment d'un match en cours ; null avant le coup d'envoi ou s'il n'est pas encore connu
          properties:
            home: { type: string, example: "1" }
            away: { type: string, example: "0" }
        markets:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              key: { type: string, enum: [h2h, double_chance, totals, btts] }
              name: { type: string, example: Résultat du match (1X2) }
              line: { type: [string, "null"], example: "2.5", description: Ligne du plus/moins ; null pour les autres marchés }
              odds_version: { type: integer, description: "À renvoyer avec le pari ; le serveur refuse une version périmée (P4-03)" }
              odds_updated_at: { type: string, format: date-time }
              bettable: { type: boolean, description: "false : cote trop ancienne (règle de fraîcheur) ou match en direct (paris en direct désactivés, betting.allow_live), affichée mais non pariable" }
              selections:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    key: { type: string, enum: [home, draw, away, home_draw, home_away, draw_away, over, under, yes, no] }
                    label: { type: string, example: "1X", description: "1, X, 2 ; 1X, 12, X2 ; +2.5 / -2.5 ; Oui / Non" }
                    name: { type: string, example: Arsenal }
                    odds: { type: string, example: "2.10", description: Cote décimale en chaîne (jamais de float) }
    BetTicket:
      type: object
      description: Reçu immuable — mise, cotes et gain potentiel figés à l'acceptation ; seuls le statut et le gain versé évoluent au règlement.
      properties:
        id: { type: string }
        reference: { type: string, example: R16-7KQ2M9XAPB, description: Référence à communiquer au support }
        type: { type: string, enum: [single, multiple] }
        status: { type: string, enum: [pending, won, lost, void], description: "void : annulé et remboursé" }
        stake: { $ref: "#/components/schemas/Money" }
        total_odds: { type: string, example: "3.895", description: "Produit des cotes acceptées (chaîne, jamais de float)" }
        potential_payout: { $ref: "#/components/schemas/Money" }
        payout: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }], description: Gain versé ; null tant que le ticket n'est pas réglé }
        placed_at: { type: string, format: date-time }
        settled_at: { type: [string, "null"], format: date-time }
        selections:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              event:
                type: object
                properties:
                  id: { type: string }
                  name: { type: string, example: Everton – Chelsea }
                  starts_at: { type: string, format: date-time }
              market:
                type: object
                properties:
                  key: { type: string, enum: [h2h, double_chance, totals, btts] }
                  name: { type: string, example: Nombre de buts }
                  line: { type: [string, "null"], example: "2.5" }
              selection:
                type: object
                properties:
                  key: { type: string, example: over }
                  label: { type: string, example: "+2.5" }
                  name: { type: string, example: Over }
              odds: { type: string, example: "1.90", description: Cote acceptée (pas la cote actuelle du catalogue) }
              status: { type: string, enum: [pending, won, lost, void] }
    AdminTicket:
      type: object
      description: |
        Ticket vu par l'administration. La liste ne contient ni `selections`, ni `rules_snapshot`, ni `ledger_entries` ;
        le détail ajoute les sélections et l'instantané des règles, et les écritures avec la permission ledger.view.
      properties:
        id: { type: string }
        reference: { type: string, example: R16-7KQ2M9XAPB }
        type: { type: string, enum: [single, multiple] }
        status: { type: string, enum: [pending, won, lost, void] }
        user:
          type: object
          description: Données minimales du joueur
          properties:
            id: { type: string }
            name: { type: string }
        wallet_id: { type: string }
        stake: { $ref: "#/components/schemas/Money" }
        total_odds: { type: string, example: "3.895" }
        potential_payout: { $ref: "#/components/schemas/Money" }
        payout: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }] }
        rules_version: { type: string }
        placed_at: { type: string, format: date-time }
        settled_at: { type: [string, "null"], format: date-time }
        rules_snapshot: { type: object, description: Règles acceptées par le joueur (détail uniquement) }
        selections: { type: array, items: { $ref: "#/components/schemas/BetTicket/properties/selections/items" } }
        ledger_entries: { type: array, items: { $ref: "#/components/schemas/AdminLedgerEntry" } }
    AdminLedgerEntry:
      type: object
      properties:
        id: { type: string }
        wallet_id: { type: string }
        user_id: { type: string }
        type: { type: string, enum: [simulated_credit, stake, payout, refund, reversal] }
        amount: { $ref: "#/components/schemas/Money" }
        balance_after: { $ref: "#/components/schemas/Money" }
        reference: { type: string, example: "bet:42:stake" }
        related: { type: [object, "null"], properties: { type: { type: string, example: bet }, id: { type: string } } }
        reversal_of_id: { type: [string, "null"], description: Écriture compensée par celle-ci }
        reversed_by_id: { type: [string, "null"], description: Écriture qui compense celle-ci }
        description: { type: [string, "null"] }
        created_by: { type: [string, "null"], description: "Administrateur à l'origine de l'écriture ; null = système" }
        created_at: { type: string, format: date-time }
        correctable: { type: boolean, description: "true : peut faire l'objet d'une correction financière" }
    Reconciliation:
      type: object
      properties:
        generated_at: { type: string, format: date-time }
        checked:
          type: object
          properties:
            wallets: { type: integer }
            ledger_entries: { type: integer }
            tickets: { type: integer }
        totals:
          type: array
          items:
            type: object
            properties:
              currency: { type: string, example: HTG }
              type: { type: string, enum: [simulated_credit, stake, payout, refund, reversal] }
              entries: { type: integer }
              sum: { $ref: "#/components/schemas/Money" }
        discrepancies_count: { type: integer }
        discrepancies:
          type: array
          items:
            type: object
            required: [kind]
            properties:
              kind: { type: string, enum: [balance_chain, ticket_amount, orphan_entry] }
              wallet_id: { type: string }
              ledger_entry_id: { type: string }
              ticket_id: { type: string }
              reference: { type: string }
              status: { type: string }
              related: { type: object, properties: { type: { type: string }, id: { type: string } } }
              expected: { $ref: "#/components/schemas/Money" }
              actual: { $ref: "#/components/schemas/Money" }
        truncated: { type: boolean, description: "true : au moins un contrôle a plus d'écarts que la liste n'en montre" }
    FinanceCorrection:
      type: object
      properties:
        id: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        reason: { type: string }
        ledger_entry: { $ref: "#/components/schemas/AdminLedgerEntry" }
        requested_by: { type: object, properties: { id: { type: string }, name: { type: string } } }
        requested_at: { type: string, format: date-time }
        decided_by: { type: [object, "null"], properties: { id: { type: string }, name: { type: string } } }
        decision_reason: { type: [string, "null"] }
        decided_at: { type: [string, "null"], format: date-time }
        reversal_entry_id: { type: [string, "null"], description: Écriture compensatoire passée à la validation }
    Money:
      type: object
      description: Montant en unité mineure (entier) — jamais de nombre décimal.
      properties:
        minor: { type: integer, example: 10050 }
        currency: { type: string, example: HTG }
