            schema:
              type: object
              required: [status, reason]
              properties:
                status: { type: string, enum: [final, cancelled] }
                home_score: { type: [string, "null"], example: "1", description: "Obligatoire si final" }
                away_score: { type: [string, "null"], example: "2", description: "Obligatoire si final" }
                reason: { type: string, minLength: 5, maxLength: 500 }
                regulation_time:
                  type: boolean
                  description: "Le score est celui du temps réglementaire (D-03). Exigé à true pour le football si status = final"
      responses:
        "201":
          description: Demande créée, en attente
          content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/ResultCorrection" } } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
