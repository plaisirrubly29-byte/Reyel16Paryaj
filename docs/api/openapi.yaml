openapi: 3.1.0
info:
  title: REYEL 16 PAYAJ API
  version: 1.0.0-draft
  description: |
    Contrat de l'API v1. Toute route doit être documentée ici AVANT l'intégration frontend.
    Les routes marquées `x-task` ne sont pas encore implémentées.

    Conventions (format des réponses, codes d'erreur, pagination, idempotence) : docs/api/README.md.
    Toute erreur suit le schéma `Error`.
servers:
  - url: http://localhost:8000/api/v1
    description: Développement local

tags:
  - name: System
  - name: Auth
  - name: Catalogue
  - name: Bets
  - name: Wallet
  - name: Admin

paths:
  /health:
    get:
      tags: [System]
      summary: État de l'API
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  version: { type: string, example: v1 }
                  time: { type: string, format: date-time }

  /auth/register:
    post:
      tags: [Auth]
      summary: Inscription (compte joueur) — ouvre la session
      description: Limité à 5 requêtes/minute par IP. Âge minimum configurable (IDENTITY_MINIMUM_AGE, 18 par défaut).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, password_confirmation, birth_date]
              properties:
                name: { type: string, maxLength: 100 }
                email: { type: string, format: email }
                password: { type: string, minLength: 10, description: "Au moins une lettre et un chiffre" }
                password_confirmation: { type: string }
                birth_date: { type: string, format: date, example: "1998-05-21" }
                country: { type: string, minLength: 2, maxLength: 2, example: HT }
      responses:
        "201":
          description: Compte créé, session ouverte
          content: { application/json: { schema: { $ref: "#/components/schemas/UserEnvelope" } } }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /auth/login:
    post:
      tags: [Auth]
      summary: Connexion
      description: |
        Même réponse `422 invalid_credentials` que le compte existe ou non (pas d'énumération).
        Limité à 5 tentatives/minute par email+IP et 20/minute par IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Session ouverte
          content: { application/json: { schema: { $ref: "#/components/schemas/UserEnvelope" } } }
        "422":
          description: "`invalid_credentials` ou `validation_failed`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "423":
          description: "`account_suspended` — compte suspendu, exclu ou fermé"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Déconnexion (invalide la session)
      security: [{ sessionCookie: [] }]
      responses:
        "204": { description: Session fermée }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /me:
    get:
      tags: [Auth]
      summary: Utilisateur connecté
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/UserEnvelope" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /sports:
    get: { tags: [Catalogue], summary: Liste des sports, x-task: P3-05, responses: { "200": { description: OK } } }
  /competitions:
    get: { tags: [Catalogue], summary: Liste des compétitions, x-task: P3-05, responses: { "200": { description: OK } } }
  /events:
    get: { tags: [Catalogue], summary: Événements ouverts, x-task: P3-05, responses: { "200": { description: OK } } }
  /events/{id}/markets:
    get:
      tags: [Catalogue]
      summary: Marchés et cotes disponibles d'un événement
      x-task: P3-05
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK } }

  /bets:
    post:
      tags: [Bets]
      summary: Placer un pari (simulé en V1)
      x-task: P4-03
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201": { description: Ticket créé (reçu immuable) }
        "409": { description: Cote changée — confirmation requise }
        "422": { description: "Marché fermé, limites, solde insuffisant" }
    get: { tags: [Bets], summary: Mes tickets, x-task: P4-04, responses: { "200": { description: OK } } }
  /bets/{id}:
    get:
      tags: [Bets]
      summary: Détail d'un ticket
      x-task: P4-04
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK }, "404": { description: Introuvable ou non autorisé } }

  /wallet:
    get: { tags: [Wallet], summary: Solde, x-task: P5-03, responses: { "200": { description: OK } } }
  /wallet/transactions:
    get: { tags: [Wallet], summary: Historique des écritures, x-task: P5-03, responses: { "200": { description: OK } } }

  /admin/events/{id}:
    patch:
      tags: [Admin]
      summary: Modifier l'état d'un événement (motif requis)
      x-task: P6-02
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK }, "403": { description: Permission refusée } }
  /admin/markets/{id}:
    patch:
      tags: [Admin]
      summary: Suspendre / masquer un marché (motif requis)
      x-task: P6-02
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK }, "403": { description: Permission refusée } }
  /admin/users/{id}:
    patch:
      tags: [Admin]
      summary: Suspendre un compte (motif requis)
      x-task: P6-03
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK }, "403": { description: Permission refusée } }

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID unique par intention utilisateur. Une requête rejouée renvoie la même réponse.
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      description: Taille de page, bornée à 100.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    ValidationError:
      description: Données invalides
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              code: validation_failed
              message: Les données envoyées sont invalides.
              details: { email: ["Le champ email est obligatoire."] }
    Unauthenticated:
      description: Authentification requise
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: unauthenticated, message: Authentification requise. } }
    Forbidden:
      description: Permission refusée
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: forbidden, message: Action non autorisée. } }
    NotFound:
      description: Introuvable (ou non autorisé, sans révéler l'existence)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: not_found, message: Ressource introuvable. } }
    TooManyRequests:
      description: Trop de tentatives
      headers:
        Retry-After: { schema: { type: integer }, description: Secondes avant de réessayer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: { code: too_many_requests, message: Trop de tentatives. Réessayez plus tard. } }

  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: reyel-16-payaj-session
      description: |
        Mode SPA de Sanctum : appeler `GET /sanctum/csrf-cookie` (hors /api/v1), puis envoyer le cookie
        de session et l'en-tête `X-XSRF-TOKEN` (valeur du cookie XSRF-TOKEN) sur chaque requête.

  schemas:
    User:
      type: object
      properties:
        id: { type: string, example: "42" }
        name: { type: string }
        email: { type: string, format: email }
        status: { type: string, enum: [active, suspended, excluded, closed] }
        roles:
          type: array
          items: { type: string, enum: [super_admin, operations, finance, support, compliance] }
          description: Vide pour un joueur.
        is_admin: { type: boolean }
        profile:
          type: [object, "null"]
          properties:
            first_name: { type: [string, "null"] }
            last_name: { type: [string, "null"] }
            birth_date: { type: [string, "null"], format: date }
            phone: { type: [string, "null"] }
            country: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
    UserEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/User" }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Identifiant stable (snake_case) sur lequel le client se base.
              example: validation_failed
            message:
              type: string
              description: Message lisible, affichable tel quel.
            details:
              type: object
              additionalProperties: true
              description: Informations complémentaires (ex. erreurs par champ).
    PaginationLinks:
      type: object
      properties:
        first: { type: [string, "null"] }
        last: { type: [string, "null"] }
        prev: { type: [string, "null"] }
        next: { type: [string, "null"] }
    PaginationMeta:
      type: object
      properties:
        current_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        last_page: { type: integer }
        from: { type: [integer, "null"] }
        to: { type: [integer, "null"] }
        path: { type: string }
    Money:
      type: object
      description: Montant en unité mineure (entier) — jamais de nombre décimal.
      properties:
        minor: { type: integer, example: 10050 }
        currency: { type: string, example: HTG }
