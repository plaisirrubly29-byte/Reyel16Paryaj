      description: |
        Permission results.approve ; jamais le demandeur (403 self_approval_forbidden), ni un rôle attribué par un administrateur depuis moins de 24 h (403 approver_role_too_recent). Dans une transaction : nouvelle
        version du résultat (source manual, validateur, motif), réévaluation des tickets déjà réglés — gain ou
