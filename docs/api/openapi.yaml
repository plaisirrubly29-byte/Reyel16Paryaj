  /admin/dashboard:
    get:
      tags: [Admin]
      summary: Indicateurs de la vue d'ensemble sur une période (permission dashboard.view)
      description: |
        Chaque section n'est présente que si le rôle a la permission correspondante :
        users (users.view), betting (tickets.view), finance (ledger.view), catalogue (events.view).
        Journées découpées dans le fuseau d'affichage (APP_DISPLAY_TIMEZONE), dates stockées en UTC.
        Définitions : mises = tickets PLACÉS dans la période ; gains payés et remboursements = tickets RÉGLÉS
        dans la période ; produit brut = mises réglées (hors annulés) - gains payés ; exposition = gains
        potentiels des tickets en cours (pas une perte certaine). Montants en unités mineures.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: period, in: query, schema: { type: string, enum: [today, yesterday, 7d, 30d, month, last_month, custom], default: 7d } }
        - { name: from, in: query, description: "Obligatoire si period=custom", schema: { type: string, format: date } }
        - { name: to, in: query, description: "Obligatoire si period=custom ; 366 jours au plus", schema: { type: string, format: date } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      generated_at: { type: string, format: date-time }
                      currency: { type: string, example: HTG }
                      period:
                        type: object
                        properties:
                          preset: { type: string }
                          from: { type: string, format: date }
                          to: { type: string, format: date }
                          days: { type: integer }
                          timezone: { type: string, example: America/Port-au-Prince }
                      users:
                        type: object
                        properties:
                          total: { type: integer }
                          active: { type: integer }
                          suspended: { type: integer }
                          excluded: { type: integer }
                          new_today: { type: integer }
                          new_in_period: { type: integer }
                          registrations: { $ref: "#/components/schemas/DailySeries" }
                      betting:
                        type: object
                        properties:
                          tickets_placed: { type: integer }
                          stakes_minor: { type: integer }
                          tickets_settled: { type: integer }
                          payouts_minor: { type: integer }
                          refunds_minor: { type: integer }
                          pending_count: { type: integer }
                          pending_exposure_minor: { type: integer, description: "Gains potentiels des tickets en cours" }
                          status_breakdown: { type: array, items: { type: object, properties: { status: { type: string }, count: { type: integer } } } }
                          stakes_by_sport:
                            type: array
                            description: Un combiné mêlant plusieurs sports est compté dans « multisport ».
                            items: { type: object, properties: { sport: { type: string }, name: { type: string }, tickets: { type: integer }, stakes_minor: { type: integer } } }
                          tickets: { $ref: "#/components/schemas/DailySeries" }
                          stakes_daily_minor: { $ref: "#/components/schemas/DailySeries" }
                      finance:
                        type: object
                        properties:
                          settled_stakes_minor: { type: integer }
                          payouts_minor: { type: integer }
                          gross_gaming_revenue_minor: { type: integer, description: "Mises réglées - gains versés" }
                          pending_corrections: { type: integer }
                          payments_available: { type: boolean, description: "false tant qu'aucun prestataire de paiement n'est intégré (P7-01)" }
                      catalogue:
                        type: object
                        properties:
                          events_live: { type: integer }
                          events_scheduled: { type: integer }
                          events_next_24h: { type: integer }
                          markets_open: { type: integer }
                          markets_suspended: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
