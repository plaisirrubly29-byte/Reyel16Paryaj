        potential_payout: { $ref: "#/components/schemas/Money" }
        payout: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }], description: Gain versé ; null tant que le ticket n'est pas réglé }
        placed_at: { type: string, format: date-time }
        settled_at: { type: [string, "null"], format: date-time }
        selections:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
