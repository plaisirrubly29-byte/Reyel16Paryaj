        first_approved_by: { type: [object, "null"], properties: { id: { type: string }, name: { type: string } } }
        first_approved_at: { type: [string, "null"], format: date-time }
        second_approved_by: { type: [object, "null"], properties: { id: { type: string }, name: { type: string } } }
        second_approved_at: { type: [string, "null"], format: date-time }
        rejected_by: { type: [object, "null"], properties: { id: { type: string }, name: { type: string } } }
        rejection_reason: { type: [string, "null"] }
        review_reason: { type: [string, "null"], example: amount_mismatch }
        created_at: { type: string, format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
        history:
          type: array
          description: Détail seulement — chaque étape, de la plus ancienne à la plus récente
          items:
            type: object
            properties:
              action: { type: string, enum: [requested, first_approved, second_approved, sent, paid, failed, rejected, cancelled, review] }
              actor: { type: [object, "null"], description: "null : le prestataire ou le système", properties: { id: { type: string }, name: { type: string } } }
              note: { type: [string, "null"] }
              created_at: { type: string, format: date-time }
    AdminLedgerEntry:
      type: object
      properties:
        id: { type: string }
        wallet_id: { type: string }
        user_id: { type: string }
        type: { type: string, enum: [simulated_credit, deposit, withdrawal, stake, payout, refund, reversal] }
        amount: { $ref: "#/components/schemas/Money" }
        balance_after: { $ref: "#/components/schemas/Money" }
        reference: { type: string, example: "bet:42:stake" }
        related: { type: [object, "null"], properties: { type: { type: string, example: bet }, id: { type: string } } }
        reversal_of_id: { type: [string, "null"], description: Écriture compensée par celle-ci }
        reversed_by_id: { type: [string, "null"], description: Écriture qui compense celle-ci }
        description: { type: [string, "null"], description: "Libellé vu par le joueur ; neutre pour une compensation" }
        reason: { type: [string, "null"], description: "Motif interne d'une compensation, jamais renvoyé au joueur" }
        created_by: { type: [string, "null"], description: "Administrateur à l'origine de l'écriture ; null = système" }
        created_at: { type: string, format: date-time }
        correctable: { type: boolean, description: "true : peut faire l'objet d'une correction financière" }
    Reconciliation:
      type: object
      properties:
        generated_at: { type: string, format: date-time }
        checked:
          type: object
          properties:
            wallets: { type: integer }
            ledger_entries: { type: integer }
            tickets: { type: integer }
        totals:
          type: array
          items:
            type: object
            properties:
              currency: { type: string, example: HTG }
              type: { type: string, enum: [simulated_credit, deposit, withdrawal, stake, payout, refund, reversal] }
              entries: { type: integer }
              sum: { $ref: "#/components/schemas/Money" }
        discrepancies_count: { type: integer }
        discrepancies:
          type: array
          items:
            type: object
            required: [kind]
            properties:
              kind: { type: string, enum: [balance_chain, ticket_amount, orphan_entry] }
              wallet_id: { type: string }
              ledger_entry_id: { type: string }
              ticket_id: { type: string }
              reference: { type: string }
              status: { type: string }
              related: { type: object, properties: { type: { type: string }, id: { type: string } } }
              expected: { $ref: "#/components/schemas/Money" }
              actual: { $ref: "#/components/schemas/Money" }
        truncated: { type: boolean, description: "true : au moins un contrôle a plus d'écarts que la liste n'en montre" }
    ResultCorrectionImpact:
      type: object
      description: Tickets dont l'issue change (aperçu ou réévaluation appliquée)
      properties:
        tickets_count: { type: integer }
        ledger_delta_minor: { type: integer, description: "Somme des variations de gain (négatif : argent repris)" }
        pending_tickets_count: { type: integer, description: "Premier résultat validé (V2-D04) : tickets en attente, réglés juste après" }
        tickets:
          type: array
          items:
            type: object
            properties:
              ticket_id: { type: string }
              reference: { type: string }
              user_id: { type: string }
              from: { type: object, properties: { status: { type: string }, payout_minor: { type: integer } } }
              to: { type: object, properties: { status: { type: string, enum: [pending, won, lost, void] }, payout_minor: { type: integer } } }
              ledger_delta_minor: { type: integer }
    ResultCorrection:
      type: object
      properties:
        id: { type: string }
        event: { type: object, properties: { id: { type: string }, name: { type: string, example: "Arsenal – Chelsea" } } }
        status: { type: string, enum: [pending, approved, rejected] }
        kind: { type: string, enum: [initial, correction], description: "initial : premier résultat saisi à la main, le fournisseur n'en ayant publié aucun (V2-D04)" }
        current: { type: [object, "null"], description: "Version en vigueur lors de la demande ; null pour un premier résultat", properties: { version: { type: integer }, status: { type: string }, score: { type: [string, "null"] } } }
        proposed: { type: object, properties: { status: { type: string, enum: [final, cancelled] }, score: { type: [string, "null"] } } }
        source: { type: string, description: "manual (administrateur) ou nom du fournisseur" }
        reason: { type: string }
        requested_by: { type: [object, "null"], description: "null : correction envoyée par le fournisseur" }
        decided_by: { type: [object, "null"] }
        decision_reason: { type: [string, "null"] }
        decided_at: { type: [string, "null"], format: date-time }
        applied_result_id: { type: [string, "null"] }
        impact: { oneOf: [{ $ref: "#/components/schemas/ResultCorrectionImpact" }, { type: "null" }], description: "Réévaluation appliquée (validée)" }
        preview: { $ref: "#/components/schemas/ResultCorrectionImpact" }
        created_at: { type: string, format: date-time }
    FinanceCorrection:
      type: object
      properties:
        id: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        reason: { type: string }
        ledger_entry: { $ref: "#/components/schemas/AdminLedgerEntry" }
        requested_by: { type: object, properties: { id: { type: string }, name: { type: string } } }
        requested_at: { type: string, format: date-time }
        decided_by: { type: [object, "null"], properties: { id: { type: string }, name: { type: string } } }
        decision_reason: { type: [string, "null"] }
        decided_at: { type: [string, "null"], format: date-time }
        reversal_entry_id: { type: [string, "null"], description: Écriture compensatoire passée à la validation }
    PlatformSettings:
      type: object
      properties:
        version: { type: integer, description: "0 : aucune version enregistrée (configuration du serveur)" }
        updated_at: { type: [string, "null"], format: date-time }
        updated_by: { type: [object, "null"], properties: { id: { type: string }, name: { type: string } } }
        items:
          type: array
          items:
            type: object
            properties:
              key: { type: string, example: betting.min_stake_minor }
              group: { type: string, example: Paris }
              label: { type: string, example: Mise minimale }
              type: { type: string, enum: [money, integer, boolean, choice] }
              help: { type: [string, "null"] }
              options: { type: [array, "null"], items: { type: string } }
              currency: { type: [string, "null"], description: "Type money : montants en unité mineure" }
              value: { description: Valeur en vigueur }
              default: { description: "Valeur de la configuration du serveur (.env)" }
    SettingVersion:
      type: object
      properties:
        id: { type: string }
        version: { type: integer }
        changes:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              label: { type: string }
              type: { type: string, enum: [money, integer, boolean, choice] }
              from: {}
              to: {}
        reason: { type: string }
        created_by: { type: object, properties: { id: { type: string }, name: { type: string } } }
        created_at: { type: string, format: date-time }
    Money:
      type: object
      description: Montant en unité mineure (entier) — jamais de nombre décimal.
      properties:
        minor: { type: integer, example: 10050 }
        currency: { type: string, example: HTG }
    ComplaintAttachment:
      type: object
      description: Contenu par GET …/attachments/{id} (joueur ou admin).
      properties:
        id: { type: string }
        filename: { type: string, description: "Nom d'origine, nettoyé" }
        mime_type: { type: string, enum: [image/jpeg, image/png, image/webp, application/pdf] }
        size_bytes: { type: integer }
    ComplaintLink:
      type: [object, "null"]
      description: Objet concerné ; null si aucun. Type agent réservé à V2-G01.
      properties:
        type: { type: string, enum: [bet, ledger_entry] }
        id: { type: string }
        label: { type: string, description: "Référence lisible : référence du ticket, ou type et date de l'écriture", example: R16-7KQ2M9XAPB }
    Complaint:
      type: object
      properties:
        id: { type: string }
        number: { type: string, example: REC-2026-000042, description: Numéro unique à communiquer au support }
        category: { type: string, enum: [bet, transaction, account, other] }
        subject: { type: string }
        status: { type: string, enum: [new, in_progress, investigation, resolved, closed] }
        link: { $ref: "#/components/schemas/ComplaintLink" }
        resolution: { type: [string, "null"], description: "Motif du dernier passage en resolved, montré au joueur" }
        can_reopen: { type: boolean, description: "resolved ou closed, et dans le délai de réouverture" }
        last_activity_at: { type: string, format: date-time }
        resolved_at: { type: [string, "null"], format: date-time }
        closed_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    ComplaintMessage:
      type: object
      properties:
        id: { type: string }
        author:
          type: object
          properties:
            type: { type: string, enum: [player, staff] }
            name: { type: string, description: "Côté joueur : « Service client » pour l'équipe" }
        body: { type: string }
        attachments: { type: array, items: { $ref: "#/components/schemas/ComplaintAttachment" } }
        created_at: { type: string, format: date-time }
    ComplaintEvent:
      type: object
      description: Entrée d'historique, en ajout seul.
      properties:
        id: { type: string }
        type: { type: string, enum: [created, status_changed, reopened, assigned, replied, note_added] }
        from_status: { type: [string, "null"] }
        to_status: { type: [string, "null"] }
        reason: { type: [string, "null"], description: "Côté joueur : seulement pour resolved et reopened" }
        actor:
          type: object
          properties:
            type: { type: string, enum: [player, staff, system] }
            name: { type: string, description: "Côté joueur : « Service client » pour l'équipe" }
        created_at: { type: string, format: date-time }
    ComplaintDetail:
      description: Vue du joueur — ni notes internes, ni événements assigned ou note_added, ni identité des administrateurs.
      allOf:
        - $ref: "#/components/schemas/Complaint"
        - type: object
          properties:
            description: { type: string }
            attachments: { type: array, items: { $ref: "#/components/schemas/ComplaintAttachment" }, description: Pièces de l'ouverture }
            messages: { type: array, items: { $ref: "#/components/schemas/ComplaintMessage" }, description: Plus anciens d'abord }
            history: { type: array, items: { $ref: "#/components/schemas/ComplaintEvent" }, description: Plus anciens d'abord }
    AdminComplaint:
      allOf:
        - $ref: "#/components/schemas/Complaint"
        - type: object
          properties:
            user: { type: object, properties: { id: { type: string }, name: { type: string } } }
            assignee: { type: [object, "null"], properties: { id: { type: string }, name: { type: string } } }
            awaiting_staff: { type: boolean, description: Dernier message du joueur sans réponse de l'équipe }
            waiting_since: { type: [string, "null"], format: date-time, description: Depuis quand le joueur attend une réponse }
    AdminComplaintDetail:
      description: Vue complète — notes internes (visibility internal) et identité des administrateurs.
      allOf:
        - $ref: "#/components/schemas/AdminComplaint"
        - type: object
          properties:
            description: { type: string }
            attachments: { type: array, items: { $ref: "#/components/schemas/ComplaintAttachment" } }
            messages:
              type: array
              items:
                allOf:
                  - $ref: "#/components/schemas/ComplaintMessage"
                  - type: object
                    properties:
                      visibility: { type: string, enum: [player, internal] }
                      author: { type: object, properties: { id: { type: [string, "null"] } } }
            history:
              type: array
              items:
                allOf:
                  - $ref: "#/components/schemas/ComplaintEvent"
                  - type: object
                    properties:
                      actor: { type: object, properties: { id: { type: [string, "null"] } } }
